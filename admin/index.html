  async function telaCalendario(){
    var rc = await U.ler("calendario", null);
    var rp = await U.ler("campanhas", function(q){ return q.not("prazo", "is", null); });

    if(abaAtual!=="calendario")return;
    var itens = rc.dados;
    var campanhas = rp.dados;

    /* prazos de campanha entram como itens que nao se edita aqui */
    var prazos = campanhas.map(function(c){
      return {
        id: "prazo-" + c.id,
        titulo: "Prazo: " + (c.campanha || "campanha"),
        marca: c.cliente || "",
        tipo: "prazo",
        data: c.prazo,
        status: (c.status === "Entregue") ? "feito" : "a fazer",
        ehPrazo: true
      };
    });

    function todosDoDia(iso){
      var lista = itens.concat(prazos).filter(function(i){ return String(i.data || "").slice(0,10) === iso; });
      if(filtroTipoCal !== "todos") lista = lista.filter(function(i){ return i.tipo === filtroTipoCal; });
      return lista;
    }

    function desenhar(){
      var ano = mesVisivel.getFullYear();
      var mes = mesVisivel.getMonth();
      var primeiro = new Date(ano, mes, 1);
      var deslocamento = (primeiro.getDay() + 6) % 7;
      var inicio = new Date(ano, mes, 1 - deslocamento);
      var hoje = hojeISO();

      var nomeMes = primeiro.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
      nomeMes = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1);

      var html = "";
      html += blocoAviso(rc.erro);
      html += blocoAviso(rp.erro);

      html += '<div class="cal-topo">' +
        '<button class="icone-btn" id="mes-antes" title="Mes anterior">' + icone("esquerda") + '</button>' +
        '<button class="icone-btn" id="mes-depois" title="Proximo mes">' + icone("direita") + '</button>' +
        '<div class="cal-mes">' + esc(nomeMes) + '</div>' +
        '<button class="btn btn-mini" id="mes-hoje">Este mes</button>' +
        '<select id="filtro-cal" style="width:auto;margin-left:auto">' +
          '<option value="todos">Todos os tipos</option>' +
          TIPOS_CAL.map(function(t){ return '<option value="' + t.valor + '"' + (filtroTipoCal === t.valor ? " selected" : "") + '>' + t.texto + '</option>'; }).join("") +
        '</select>' +
        '<button class="btn btn-cheio" id="btn-novo-cal">' + icone("mais") + 'Adicionar</button>' +
      '</div>';

      html += '<div class="cal-grade">';
      ["Seg","Ter","Qua","Qui","Sex","Sab","Dom"].forEach(function(d){
        html += '<div class="cal-cabecalho">' + d + '</div>';
      });

      for(var c = 0; c < 42; c++){
        var dia = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + c);
        var iso = U.paraISO(dia);
        var fora = dia.getMonth() !== mes;
        var ehHoje = (iso === hoje);
        var doDia = todosDoDia(iso);

        html += '<div class="cal-dia' + (fora ? " fora" : "") + (ehHoje ? " hoje" : "") + '" data-dia="' + iso + '">' +
                '<button class="cal-mais-btn" data-add="' + iso + '" title="Adicionar neste dia">+</button>' +
                '<div class="cal-numero">' + dia.getDate() + '</div>';

        doDia.slice(0, 3).forEach(function(i){
          html += '<button class="cal-item ' + esc(i.tipo) + (i.status === "feito" ? " feito" : "") + '"' +
                  (i.ehPrazo ? "" : ' data-item="' + esc(i.id) + '"') +
                  ' title="' + esc(i.titulo) + '">' + esc(i.titulo) + '</button>';
        });
        if(doDia.length > 3){
          html += '<button class="cal-mais" data-dia-todos="' + iso + '">mais ' + (doDia.length - 3) + '</button>';
        }
        html += '</div>';
      }
      html += '</div>';

      /* ficou pra tras */
      var atrasados = itens.filter(function(i){
        var d = String(i.data || "").slice(0,10);
        return i.status === "a fazer" && d && d < hoje;
      }).sort(function(a,b){ return String(a.data).localeCompare(String(b.data)); });

      html += '<div class="atrasados"><div class="bloco-titulo">Ficou pra tras</div>';
      if(atrasados.length === 0){
        html += blocoVazio("Nada atrasado por aqui. Tudo em dia.");
      } else {
        atrasados.forEach(function(i){
          var d = diasEntre(hoje, i.data);
          html += '<div class="atraso-linha">' +
            '<span class="pilula p-status">' + esc(i.tipo) + '</span>' +
            '<strong style="font-weight:400">' + esc(i.titulo) + '</strong>' +
            (i.marca ? '<span style="color:var(--tinta-suave)">' + esc(i.marca) + '</span>' : "") +
            '<span class="atraso-dias">ha ' + d + ' dia' + (d === 1 ? "" : "s") + '</span>' +
            '<button class="btn btn-mini" data-feito="' + esc(i.id) + '" style="margin-left:auto">Marcar feito</button>' +
            '<button class="btn btn-mini" data-item="' + esc(i.id) + '">Abrir</button>' +
          '</div>';
        });
      }
      html += '</div>';

      painel.innerHTML = html;

      document.getElementById("mes-antes").addEventListener("click", function(){
        mesVisivel = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth() - 1, 1);
        desenhar();
      });
      document.getElementById("mes-depois").addEventListener("click", function(){
        mesVisivel = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth() + 1, 1);
        desenhar();
      });
      document.getElementById("mes-hoje").addEventListener("click", function(){
        var d = new Date();
        mesVisivel = new Date(d.getFullYear(), d.getMonth(), 1);
        desenhar();
      });
      document.getElementById("filtro-cal").addEventListener("change", function(e){
        filtroTipoCal = e.target.value;
        desenhar();
      });

      function novoNoDia(iso){
        abrirFormulario({
          titulo: "Novo item",
          tabela: "calendario",
          campos: CAMPOS_CAL,
          registro: { data: iso },
          antesDeSalvar: function(d){
            if(!d.titulo) return "Escreva o que e para fazer.";
            if(!d.data) return "Escolha a data.";
          },
          depois: telaCalendario
        });
      }

      document.getElementById("btn-novo-cal").addEventListener("click", function(){ novoNoDia(hojeISO()); });

      Array.prototype.forEach.call(painel.querySelectorAll("[data-add]"), function(b){
        b.addEventListener("click", function(e){
          e.stopPropagation();
          novoNoDia(b.getAttribute("data-add"));
        });
      });

      Array.prototype.forEach.call(painel.querySelectorAll(".cal-dia"), function(celula){
        celula.addEventListener("click", function(e){
          if(e.target.closest("button")) return;
          novoNoDia(celula.getAttribute("data-dia"));
        });
      });

      Array.prototype.forEach.call(painel.querySelectorAll("[data-item]"), function(b){
        b.addEventListener("click", function(e){
          e.stopPropagation();
          var item = itens.filter(function(x){ return String(x.id) === b.getAttribute("data-item"); })[0];
          if(!item) return;
          abrirFormulario({
            titulo: "Editar item",
            tabela: "calendario",
            campos: CAMPOS_CAL,
            registro: item,
            antesDeSalvar: function(d){
              if(!d.titulo) return "Escreva o que e para fazer.";
              if(!d.data) return "Escolha a data.";
            },
            depois: telaCalendario
          });
        });
      });

      Array.prototype.forEach.call(painel.querySelectorAll("[data-feito]"), function(b){
        b.addEventListener("click", async function(e){
          e.stopPropagation();
          var r = await U.gravar("calendario", function(q){
            return q.update({ status: "feito" }).eq("id", b.getAttribute("data-feito"));
          });
          if(!r.ok){ falar(r.erro, true); return; }
          falar("Marcado como feito.");
          telaCalendario();
        });
      });

      Array.prototype.forEach.call(painel.querySelectorAll("[data-dia-todos]"), function(b){
        b.addEventListener("click", function(e){
          e.stopPropagation();
          var iso = b.getAttribute("data-dia-todos");
          var lista = todosDoDia(iso);
          var h = "";
          lista.forEach(function(i){
            h += '<div class="atraso-linha">' +
              '<span class="pilula p-status">' + esc(i.tipo) + '</span>' +
              '<span>' + esc(i.titulo) + '</span>' +
              (i.marca ? '<span style="color:var(--tinta-suave)">' + esc(i.marca) + '</span>' : "") +
              (i.ehPrazo ? '<span style="margin-left:auto;color:var(--tinta-suave);font-size:0.7rem">vem das campanhas</span>'
                         : '<button class="btn btn-mini" data-abrir="' + esc(i.id) + '" style="margin-left:auto">Abrir</button>') +
            '</div>';
          });
          abrirModal("Dia " + U.paraBR(iso), h);
          Array.prototype.forEach.call(modalCorpo.querySelectorAll("[data-abrir]"), function(x){
            x.addEventListener("click", function(){
              var item = itens.filter(function(y){ return String(y.id) === x.getAttribute("data-abrir"); })[0];
              fecharModal();
              abrirFormulario({
                titulo: "Editar item",
                tabela: "calendario",
                campos: CAMPOS_CAL,
                registro: item,
                depois: telaCalendario
              });
            });
          });
        });
      });
    }

    desenhar();
  }

  /* ============================================================
     PARTE 7: ABA CAMPANHAS
     ============================================================ */
  var FUNIL = ["Briefing","Roteiro","Aprovação Roteiro","Gravação","Edição","Aprovado","Entregue"];
  var CAMPOS_CAMP = [
    { nome: "campanha",  rotulo: "Campanha", tipo: "text" },
    { nome: "cliente",   rotulo: "Cliente",  tipo: "text" },
    { nome: "tipo",      rotulo: "Tipo",     tipo: "select", opcoes: ["Conteúdo","Publicidade"], padrao: "Conteúdo" },
    { nome: "status",    rotulo: "Status",   tipo: "select", opcoes: FUNIL, padrao: "Briefing" },
    { nome: "qtd",       rotulo: "Quantidade de videos", tipo: "number", padrao: 1 },
    { nome: "valor",     rotulo: "Valor total (R$)",     tipo: "number", passo: "0.01", padrao: 0 },
    { nome: "prazo",     rotulo: "Prazo",    tipo: "date" },
    { nome: "pagamento", rotulo: "Pagamento", tipo: "select", opcoes: [
        { valor: "pendente", texto: "Pendente" },
        { valor: "pago",     texto: "Pago" }
      ], padrao: "pendente" },
    { nome: "ativa",     rotulo: "Campanha ativa",   tipo: "checkbox", padrao: true },
    { nome: "favorita",  rotulo: "Destacar com estrela", tipo: "checkbox", padrao: false }
  ];

  var campFiltro = "todas", campBusca = "", campOrdem = { coluna: "prazo", crescente: true };

  async function telaCampanhas(){
    var r = await U.ler("campanhas", null);
    if(abaAtual!=="campanhas")return;
    var todas = r.dados;

    function filtrar(){
      var busca = campBusca.toLowerCase();
      return todas.filter(function(c){
        if(campFiltro === "ativas" && !c.ativa) return false;
        if(campFiltro === "finalizadas" && c.ativa) return false;
        if(!busca) return true;
        return (String(c.campanha || "") + " " + String(c.cliente || "")).toLowerCase().indexOf(busca) >= 0;
      });
    }

    function ordenar(lista){
      var col = campOrdem.coluna;
      var sinal = campOrdem.crescente ? 1 : -1;
      return lista.slice().sort(function(a, b){
        var va, vb;
        if(col === "status"){
          va = FUNIL.indexOf(a.status); vb = FUNIL.indexOf(b.status);
          if(va < 0) va = 99; if(vb < 0) vb = 99;
        } else if(col === "valor" || col === "qtd"){
          va = Number(a[col]) || 0; vb = Number(b[col]) || 0;
        } else if(col === "prazo"){
          va = a.prazo || "9999-12-31"; vb = b.prazo || "9999-12-31";
        } else if(col === "favorita"){
          va = a.favorita ? 0 : 1; vb = b.favorita ? 0 : 1;
        } else {
          va = String(a[col] || "").toLowerCase(); vb = String(b[col] || "").toLowerCase();
        }
        if(va < vb) return -1 * sinal;
        if(va > vb) return 1 * sinal;
        return 0;
      });
    }

    function avisoPrazo(c){
      if(!c.prazo) return "";
      if(c.status === "Entregue") return "";
      var d = diasEntre(c.prazo, hojeISO());
      if(d === null) return "";
      if(d < 0) return '<span class="pilula etiqueta-erro">atrasado ' + Math.abs(d) + ' dia' + (Math.abs(d) === 1 ? "" : "s") + '</span>';
      if(d <= 3) return '<span class="pilula etiqueta-alerta">vence em ' + d + ' dia' + (d === 1 ? "" : "s") + '</span>';
      return "";
    }

    function desenhar(){
      var lista = ordenar(filtrar());

      var reais=todas.filter(function(c){return !/^EXEMPLO/i.test(c.campanha||"");});
      var totalCampanhas = reais.length;
      var ativas = reais.filter(function(c){ return c.ativa; }).length;
      var valorTotal = todas.reduce(function(s, c){ return s + (Number(c.valor) || 0); }, 0);
      var totalVideos = todas.reduce(function(s, c){ return s + (Number(c.qtd) || 0); }, 0);
      var ticket = U.dividir(valorTotal, totalVideos);
      var aReceber = todas.filter(function(c){ return c.pagamento === "pendente"; })
                          .reduce(function(s, c){ return s + (Number(c.valor) || 0); }, 0);
      var recebido = todas.filter(function(c){ return c.pagamento === "pago"; })
                          .reduce(function(s, c){ return s + (Number(c.valor) || 0); }, 0);

      var html = "";
      html += blocoAviso(r.erro);

      html += '<div class="faixa-numeros">' +
        '<div class="num-item"><div class="num-valor">' + totalCampanhas + '</div><div class="num-rotulo">Campanhas</div></div>' +
        '<div class="num-item"><div class="num-valor">' + ativas + '</div><div class="num-rotulo">Ativas agora</div></div>' +
        '<div class="num-item"><div class="num-valor">' + U.emReais(valorTotal) + '</div><div class="num-rotulo">Valor total</div>' +
          '<div class="num-extra">' + (totalVideos > 0 ? U.emReais(ticket) + " por video" : "sem video cadastrado ainda") + '</div></div>' +
        '<div class="num-item"><div class="num-valor">' + U.emReais(aReceber) + '</div><div class="num-rotulo">A receber</div>' +
          '<div class="num-extra">' + U.emReais(recebido) + ' ja recebido</div></div>' +
      '</div>';

      html += '<div class="barra-acoes">' +
        '<button class="btn' + (campFiltro === "todas" ? " btn-cheio" : "") + '" data-filtro="todas">Todas</button>' +
        '<button class="btn' + (campFiltro === "ativas" ? " btn-cheio" : "") + '" data-filtro="ativas">Ativas</button>' +
        '<button class="btn' + (campFiltro === "finalizadas" ? " btn-cheio" : "") + '" data-filtro="finalizadas">Finalizadas</button>' +
        '<div class="cresce"><input type="search" id="busca-camp" placeholder="Buscar campanha ou cliente" value="' + esc(campBusca) + '"></div>' +
        '<button class="btn" id="btn-csv-camp">' + icone("baixar") + 'Baixar</button>' +
        '<button class="btn btn-cheio" id="btn-nova-camp">' + icone("mais") + 'Nova campanha</button>' +
      '</div>';

      if(todas.length === 0){
        html += blocoVazio("Voce ainda nao cadastrou campanhas. Clique em nova campanha para comecar.");
      } else if(lista.length === 0){
        html += blocoVazio("Nenhuma campanha com esse filtro.");
      } else {
        var colunas = [
          { id: "favorita", rotulo: "", largura: "32px" },
          { id: "campanha", rotulo: "Campanha" },
          { id: "cliente",  rotulo: "Cliente" },
          { id: "tipo",     rotulo: "Tipo" },
          { id: "status",   rotulo: "Status" },
          { id: "qtd",      rotulo: "Qtd" },
          { id: "valor",    rotulo: "Valor" },
          { id: "prazo",    rotulo: "Prazo" },
          { id: "pagamento",rotulo: "Pagamento" }
        ];

        html += '<div class="rolagem"><table><thead><tr>';
        colunas.forEach(function(col){
          var ordenando = campOrdem.coluna === col.id;
          var seta = ordenando ? (campOrdem.crescente ? "&#9650;" : "&#9660;") : "&#9671;";
          html += '<th class="ordenavel' + (ordenando ? " ordenando" : "") + '" data-col="' + col.id + '"' +
                  (col.largura ? ' style="width:' + col.largura + '"' : "") + '>' +
                  esc(col.rotulo) + '<span class="seta">' + seta + '</span></th>';
        });
        html += '</tr></thead><tbody>';

        lista.forEach(function(c){
          html += '<tr class="clicavel' + (c.favorita ? " favorita" : "") + '" data-id="' + esc(c.id) + '">' +
            '<td><button class="estrela' + (c.favorita ? " on" : "") + '" data-estrela="' + esc(c.id) + '" title="Destacar">&#9733;</button></td>' +
            '<td>' + esc(c.campanha || "sem nome") + '</td>' +
            '<td>' + esc(c.cliente || "") + '</td>' +
            '<td><span class="pilula ' + (c.tipo === "Publicidade" ? "p-publicidade" : "p-conteudo") + '">' + esc(c.tipo) + '</span></td>' +
            '<td><span class="pilula p-status">' + esc(c.status) + '</span></td>' +
            '<td>' + esc(c.qtd) + '</td>' +
            '<td>' + esc(U.emReais(c.valor)) + '</td>' +
            '<td>' + esc(U.paraBR(c.prazo)) + ' ' + avisoPrazo(c) + '</td>' +
            '<td><span class="pilula ' + (c.pagamento === "pago" ? "p-cliente" : "p-lead") + '">' + (c.pagamento === "pago" ? "Pago" : "Pendente") + '</span></td>' +
          '</tr>';
        });
        html += '</tbody></table></div>';
      }

      painel.innerHTML = html;

      Array.prototype.forEach.call(painel.querySelectorAll("[data-filtro]"), function(b){
        b.addEventListener("click", function(){ campFiltro = b.getAttribute("data-filtro"); desenhar(); });
      });

      var busca = document.getElementById("busca-camp");
      busca.addEventListener("input", function(){
        campBusca = busca.value;
        var p = busca.selectionStart;
        desenhar();
        var novo = document.getElementById("busca-camp");
        novo.focus();
        novo.setSelectionRange(p, p);
      });

      Array.prototype.forEach.call(painel.querySelectorAll("th[data-col]"), function(th){
        th.addEventListener("click", function(){
          var col = th.getAttribute("data-col");
          if(campOrdem.coluna === col) campOrdem.crescente = !campOrdem.crescente;
          else { campOrdem.coluna = col; campOrdem.crescente = true; }
          desenhar();
        });
      });

      Array.prototype.forEach.call(painel.querySelectorAll("[data-estrela]"), function(b){
        b.addEventListener("click", async function(e){
          e.stopPropagation();
          var id = b.getAttribute("data-estrela");
          var c = todas.filter(function(x){ return String(x.id) === id; })[0];
          var res = await U.gravar("campanhas", function(q){ return q.update({ favorita: !c.favorita }).eq("id", id); });
          if(!res.ok){ falar(res.erro, true); return; }
          telaCampanhas();
        });
      });

      Array.prototype.forEach.call(painel.querySelectorAll("tr[data-id]"), function(tr){
        tr.addEventListener("click", function(e){
          if(e.target.closest("[data-estrela]")) return;
          var c = todas.filter(function(x){ return String(x.id) === tr.getAttribute("data-id"); })[0];
          abrirFormulario({
            titulo: "Editar campanha",
            tabela: "campanhas",
            campos: CAMPOS_CAMP,
            registro: c,
            antesDeSalvar: function(d){ if(!d.campanha) return "Escreva o nome da campanha."; },
            depois: telaCampanhas
          });
        });
      });

      document.getElementById("btn-nova-camp").addEventListener("click", function(){
        abrirFormulario({
          titulo: "Nova campanha",
          tabela: "campanhas",
          campos: CAMPOS_CAMP,
          antesDeSalvar: function(d){ if(!d.campanha) return "Escreva o nome da campanha."; },
          depois: telaCampanhas
        });
      });

      document.getElementById("btn-csv-camp").addEventListener("click", function(){
        var lista2 = ordenar(filtrar());
        if(lista2.length === 0){ falar("Nao ha nada para baixar.", true); return; }
        baixarCSV("minhas-campanhas.csv",
          ["Campanha","Cliente","Tipo","Status","Qtd","Valor","Prazo","Pagamento","Ativa"],
          lista2.map(function(c){
            return [c.campanha, c.cliente, c.tipo, c.status, c.qtd,
                    String(Number(c.valor) || 0).replace(".", ","),
                    U.paraBR(c.prazo), c.pagamento, c.ativa ? "sim" : "nao"];
          })
        );
        falar("Arquivo baixado.");
      });
    }

    desenhar();
  }

  var subChecklist = "checklist";
  var marcadosMapa = {};
  var roteiroRascunho="";

    { nome: "roteiro", rotulo: "O roteiro", tipo: "textarea", alto: true,

      exemplo: "0 a 5s | Entra no meio de uma cena, sem se apresentar\n5 a 12s | A pergunta que abre o loop\n12 a 20s | Mostra o proprio problema antes do produto" }
  ];

  /* Quebra o texto do roteiro em blocos de tempo. */
  function blocosDoRoteiro(texto){
    return String(texto || "").split(/\r?\n/).map(function(linha){
      var pedacos = linha.split("|");
      if(pedacos.length >= 2){
        return { t: pedacos.shift().trim(), o: pedacos.join("|").trim() };
      }
      return { t: "", o: linha.trim() };
    }).filter(function(b){ return b.t || b.o; });
  }

  async function telaChecklist(){

    function contarSecao(secao, indice){

    /* A tela de detalhe, igual para as duas. So as minhas tem o botao de editar.
       O texto da biblioteca ja vem com negrito e italico prontos, por isso ele
       entra sem escapar. O meu texto sempre entra escapado. */
    function abrirDetalheRef(r, minha){
      var meta = [r.estilo, r.duracao, r.marca].filter(function(x){ return String(x || "").trim(); });
      var h = '<div class="ref-meta" style="margin-bottom:0.8rem">' + esc(meta.join(" · ")) + '</div>';

      function parte(titulo, texto){
        if(!String(texto || "").trim()) return "";

      }
      h += parte("Gancho", r.gancho);
      h += parte("Por que funciona", r.porque);
      h += parte("O diferencial", r.diferencial);
      h += parte("O erro comum", r.erro);

        });

      var link = minha ? U.urlSegura(r.link) : r.youtube;

          abrirFormulario({
            titulo: "Editar referencia",
            tabela: "referencias",

            registro: r,
            antesDeSalvar: function(d){ if(!d.titulo) return "Escreva o nome da referencia."; },
            depois: telaChecklist
          });
        });
      }
    }

    function ligarChecks(){
      Array.prototype.forEach.call(painel.querySelectorAll("input[data-chave]"), function(inp){
        inp.addEventListener("change", async function(){
          var chave = inp.getAttribute("data-chave");
          var anterior=!!marcadosMapa[chave];
          inp.disabled=true;
          marcadosMapa[chave] = inp.checked;
          var r = await U.gravar("marcados", function(q){
            return q.upsert({ chave: chave, marcado: inp.checked, atualizado_em: new Date().toISOString() },

          if(!r.ok){marcadosMapa[chave]=anterior;inp.checked=anterior;falar(r.erro,true);return;}

  var CAMPOS_IDEIA = [
    { nome: "titulo",    rotulo: "Ideia",      tipo: "text" },
    { nome: "descricao", rotulo: "Detalhes",   tipo: "textarea" },

        { valor: "",     texto: "Sem nicho" }
      ], padrao: "casa" },

  ];

  /* As etapas espelham as listas do seu quadro no Trello,
     na mesma ordem do seu fluxo de producao. */
  var ETAPAS_IDEIA = [
    { valor: "ideia",     texto: "Ideia" },
    { valor: "texto",     texto: "Texto para post" },
    { valor: "roteiro",   texto: "Em roteiro" },
    { valor: "gravar",    texto: "Pronto para gravar" },

    { valor: "edicao",    texto: "Em edicao" },

    { valor: "publicar",  texto: "Pronto para publicar" },
    { valor: "publicado", texto: "Publicado" },
    { valor: "analisado", texto: "Analisado" },
    { valor: "parado",    texto: "Aguardando ou parado" }
  ];
  CAMPOS_IDEIA[3].opcoes = ETAPAS_IDEIA;

  function nomeEtapa(valor){
    var e = ETAPAS_IDEIA.filter(function(x){ return x.valor === valor; })[0];
    return e ? e.texto : (valor || "");
  }

  /* Le o nome da lista do Trello e descobre a etapa correspondente,
     sem depender do emoji nem da acentuacao. */
  function etapaPelaLista(nomeLista){
    var n = String(nomeLista || "").toUpperCase();
    if(n.indexOf("TEXTO") >= 0)     return "texto";
    if(n.indexOf("ROTEIRO") >= 0)   return "roteiro";
    if(n.indexOf("GRAVAR") >= 0)    return "gravar";
    if(n.indexOf("GRAVADO") >= 0)   return "gravado";
    if(n.indexOf("EDI") >= 0)       return "edicao";
    if(n.indexOf("REVIS") >= 0)     return "revisao";
    if(n.indexOf("PUBLICAR") >= 0)  return "publicar";
    if(n.indexOf("PUBLICADO") >= 0) return "publicado";
    if(n.indexOf("ANALISADO") >= 0) return "analisado";
    if(n.indexOf("AGUARDANDO") >= 0 || n.indexOf("BLOQUEADO") >= 0) return "parado";
    return "ideia";
  }

  /* Descobre o nicho pela etiqueta que voce usa no titulo do card. */
  function nichoPeloTitulo(titulo){
    var t = String(titulo || "").toUpperCase();
    if(/\[(CASA|M[ÓO]VEIS|DECORA|BEBIDAS)/.test(t)) return "casa";
    if(/\[PET/.test(t)) return "pet";
    if(/\[(APPS|FINTECH)/.test(t)) return "tech";
    return "";
  }

  var filtroEtapa = "todas";

  async function telaIdeias(){
    var r = await U.ler("ideias", function(q){ return q.order("criado_em", { ascending: false }); });
    if(abaAtual!=="ideias")return;
    var todasIdeias = r.dados;
    var lista = (filtroEtapa === "todas")
      ? todasIdeias
      : todasIdeias.filter(function(i){ return i.status === filtroEtapa; });

    var html = blocoAviso(r.erro);

    /* quantas ideias em cada etapa do seu fluxo */
    if(todasIdeias.length > 0){
      var porEtapa = {};
      todasIdeias.forEach(function(i){
        porEtapa[i.status] = (porEtapa[i.status] || 0) + 1;
      });

        '<button class="btn' + (filtroEtapa === "todas" ? " btn-cheio" : "") + '" data-etapa="todas">' +

      });
      html += '</div>';
    }

    html += '<div class="barra-acoes"><div class="cresce">' +
      '<div class="topo-sub">Guarde aqui as ideias que aparecem no meio do dia. Importe o arquivo do Trello para trazer títulos e descrições sem duplicar ideias. A atualização é feita quando você importa um novo arquivo.</div>' +
      '</div><button class="btn btn-cheio" id="btn-nova-ideia">' + icone("mais") + 'Nova ideia</button></div>';

    html += '<div class="barra-acoes"><label class="btn" for="trello-arquivo">Importar ideias do Trello</label><input id="trello-arquivo" type="file" accept=".json,application/json" hidden><a class="btn" href="https://trello.com/b/1J5KLxi2/bypriscila-producao-de-conteudo" target="_blank" rel="noopener">Abrir meu Trello</a></div><p class="topo-sub">Escolha ideias-trello.json ou uma exportação JSON do seu quadro. Você escolhe quais listas importar. Os dados ficam na sua área privada.</p>';
    if(todasIdeias.length === 0){
      html += blocoVazio("Nenhuma ideia guardada ainda. Clique em nova ideia para escrever a primeira.");
    } else if(lista.length === 0){
      html += blocoVazio("Nenhuma ideia nesta etapa.");
    } else {
      html += '<div class="rolagem"><table><thead><tr>' +
        '<th>Ideia</th><th>Nicho</th><th>Etapa</th><th>Origem</th><th>Guardada em</th>' +
        '</tr></thead><tbody>';
      var nomeNicho = { casa: "Casa e decoracao", pet: "Pet", tech: "Tech" };
      lista.forEach(function(i){
        html += '<tr class="clicavel" data-id="' + esc(i.id) + '">' +
          '<td>' + esc(i.titulo || "sem titulo") +
            (i.descricao ? '<div class="lista-gancho">' + esc(String(i.descricao).slice(0, 70)) + (String(i.descricao).length > 70 ? "..." : "") + '</div>' : "") + '</td>' +
          '<td>' + esc(nomeNicho[i.nicho] || i.nicho || "") + '</td>' +
          '<td><span class="pilula p-status">' + esc(nomeEtapa(i.status)) + '</span></td>' +
          '<td>' + esc(i.origem) + (i.trello_lista ? '<div class="lista-gancho">'+esc(i.trello_lista)+'</div>':'') + (U.urlSegura(i.trello_url)?'<a href="'+esc(U.urlSegura(i.trello_url))+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Ver cartão</a>':'') + '</td>' +
          '<td>' + esc(U.paraBR(i.criado_em)) + '</td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
    }

    painel.innerHTML = html;

    Array.prototype.forEach.call(painel.querySelectorAll("[data-etapa]"), function(b){
      b.addEventListener("click", function(){
        filtroEtapa = b.getAttribute("data-etapa");
        telaIdeias();
      });
    });

    document.getElementById('trello-arquivo').addEventListener('change',async function(){
      const arquivo=this.files[0];if(!arquivo)return;
      try{
        if(arquivo.size>20*1024*1024)throw Error();
        const dados=JSON.parse(await arquivo.text());
        if(!Array.isArray(dados.cards)||!Array.isArray(dados.lists))throw Error();
        const listas=dados.lists.filter(l=>!l.closed);
        abrirModal('Importar do Trello','<p>Escolha as listas. Importar novamente atualiza as ideias vindas do Trello, sem duplicar. As ideias criadas aqui continuam guardadas.</p>'+listas.map((l,i)=>'<label class="item-check"><input type="checkbox" data-lista="'+i+'" '+(/IDEIAS/i.test(l.name)?'checked':'')+'><span>'+esc(l.name)+'</span></label>').join('')+'<button class="btn btn-cheio" id="confirmar-trello">Importar listas selecionadas</button>');
        document.getElementById('confirmar-trello').addEventListener('click',async function(){
          this.disabled=true;
          const selecionadas=Array.from(modalCorpo.querySelectorAll('[data-lista]:checked')).map(el=>listas[Number(el.dataset.lista)]);
          if(!selecionadas.length){falar('Escolha pelo menos uma lista.',true);this.disabled=false;return;}
          const registros=dados.cards.filter(c=>!c.closed&&selecionadas.some(l=>l.id===c.idList)).map(function(c){
            var nomeLista=String((listas.find(l=>l.id===c.idList)||{}).name||'');
            return {
              titulo:String(c.name||'Sem título'),descricao:String(c.desc||''),
              nicho:nichoPeloTitulo(c.name),status:etapaPelaLista(nomeLista),origem:'trello',
              trello_id:String(c.id),trello_url:U.urlSegura(c.url||c.shortUrl),trello_lista:nomeLista
            };
          });
          let feitos=0;
          for(let i=0;i<registros.length;i+=100){const resultado=await U.gravar('ideias',q=>q.upsert(registros.slice(i,i+100),{onConflict:'trello_id'}));if(!resultado.ok){falar(resultado.erro,true);this.disabled=false;return;}feitos+=Math.min(100,registros.length-i);}
          fecharModal();falar(feitos+' ideias importadas.');telaIdeias();
        });
      }catch(e){falar('Não consegui ler esse arquivo. Escolha a exportação JSON do Trello.',true);}
    });

    document.getElementById("btn-nova-ideia").addEventListener("click", function(){
      abrirFormulario({
        titulo: "Nova ideia",
        tabela: "ideias",
        campos: CAMPOS_IDEIA,
        antesDeSalvar: function(d){ if(!d.titulo) return "Escreva a ideia."; },
        depois: telaIdeias
      });
    });

    Array.prototype.forEach.call(painel.querySelectorAll("tr[data-id]"), function(tr){
      tr.addEventListener("click", function(){
        var i = lista.filter(function(x){ return String(x.id) === tr.getAttribute("data-id"); })[0];
        abrirFormulario({
          titulo: "Editar ideia",
          tabela: "ideias",
          campos: CAMPOS_IDEIA,
          registro: i,
          antesDeSalvar: function(d){ if(!d.titulo) return "Escreva a ideia."; },
          depois: telaIdeias
        });
      });
    });
  }

  /* ============================================================
     PARTE 9B: ABA FINANCEIRO

     Tudo que entra e tudo que sai, mes a mes.
     Para incluir uma categoria nova, basta acrescentar nas
     listas abaixo.
     ============================================================ */
  var CATEGORIAS_ENTRADA = ["UGC Creator", "Publicidade", "Afiliado", "Freelance", "TikTok", "Outros"];
  var CATEGORIAS_SAIDA   = ["Equipamento", "Software", "Produto", "Transporte", "Impostos", "Outros"];

  var mesFinanceiro = (function(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  })();
  var filtroFin = "todas";

  function camposFinanceiro(tipo){
    var ehSaida = (tipo === "saida");
    return [
      { nome: "tipo", rotulo: "Isto e uma entrada ou uma saida?", tipo: "select", opcoes: [
          { valor: "entrada", texto: "Entrada (dinheiro que voce recebe)" },
          { valor: "saida",   texto: "Saida (dinheiro que voce gasta)" }
        ], padrao: tipo || "entrada" },
      { nome: "descricao", rotulo: "Descricao", tipo: "text" },
      { nome: "valor",     rotulo: "Valor (R$)", tipo: "number", passo: "0.01", padrao: 0 },
      { nome: "categoria", rotulo: "Categoria", tipo: "select",
        opcoes: (ehSaida ? CATEGORIAS_SAIDA : CATEGORIAS_ENTRADA).map(function(c){
          return { valor: c, texto: c };
        }), padrao: ehSaida ? "Equipamento" : "UGC Creator" },
      { nome: "cliente",   rotulo: "Marca ou cliente (opcional)", tipo: "text" },
      { nome: "data",      rotulo: "Data", tipo: "date" },
      { nome: "status",    rotulo: "Situacao", tipo: "select", opcoes: [
          { valor: "recebido", texto: "Recebido" },
          { valor: "pendente", texto: "Ainda vou receber" },
          { valor: "pago",     texto: "Pago" },
          { valor: "a pagar",  texto: "Ainda vou pagar" }
        ], padrao: ehSaida ? "pago" : "recebido" },
      { nome: "notas",     rotulo: "Observacao", tipo: "textarea" }
    ];
  }

  function nomeMes(mes){
    var partes = String(mes).split("-");
    var d = new Date(Number(partes[0]), Number(partes[1]) - 1, 1);
    var texto = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  async function telaFinanceiro(){
    var rf = await U.ler("financeiro", function(q){ return q.order("data", { ascending: false }); });
    var rm = await U.ler("metas", null);

    var todas = rf.dados;
    var metas = {};
    rm.dados.forEach(function(m){ metas[m.mes] = Number(m.valor) || 0; });

    function doMes(){
      return todas.filter(function(t){ return String(t.data || "").slice(0, 7) === mesFinanceiro; });
    }

    function desenhar(){
      var lista = doMes();

      var entradas = lista.filter(function(t){ return t.tipo === "entrada"; });
      var saidas   = lista.filter(function(t){ return t.tipo === "saida"; });

      var totalEntrou = entradas.filter(function(t){ return t.status === "recebido"; })
                                .reduce(function(s, t){ return s + (Number(t.valor) || 0); }, 0);
      var totalSaiu   = saidas.filter(function(t){ return t.status === "pago"; })
                              .reduce(function(s, t){ return s + (Number(t.valor) || 0); }, 0);
      var aReceber    = entradas.filter(function(t){ return t.status === "pendente"; })
                                .reduce(function(s, t){ return s + (Number(t.valor) || 0); }, 0);
      var aPagar      = saidas.filter(function(t){ return t.status === "a pagar"; })
                              .reduce(function(s, t){ return s + (Number(t.valor) || 0); }, 0);
      var saldo = totalEntrou - totalSaiu;

      var meta = metas[mesFinanceiro] || 0;
      var pctMeta = Math.round(U.dividir(totalEntrou, meta) * 100);
      if(pctMeta > 100) pctMeta = 100;

      /* de onde vem o dinheiro */
      var porCategoria = {};
      entradas.filter(function(t){ return t.status === "recebido"; }).forEach(function(t){
        var c = (t.categoria || "").trim() || "Sem categoria";
        porCategoria[c] = (porCategoria[c] || 0) + (Number(t.valor) || 0);
      });
      var categorias = Object.keys(porCategoria).sort(function(a, b){
        return porCategoria[b] - porCategoria[a];
      });

      var html = "";
      html += blocoAviso(rf.erro);
      html += blocoAviso(rm.erro);

      /* navegacao de mes */
      html += '<div class="cal-topo">' +
        '<button class="icone-btn" id="fin-antes" title="Mes anterior">' + icone("esquerda") + '</button>' +
        '<button class="icone-btn" id="fin-depois" title="Proximo mes">' + icone("direita") + '</button>' +
        '<div class="cal-mes">' + esc(nomeMes(mesFinanceiro)) + '</div>' +
        '<button class="btn btn-mini" id="fin-hoje">Este mes</button>' +
        '<button class="btn btn-mini" id="fin-meta" style="margin-left:auto">' +
          (meta > 0 ? "Mudar a meta" : "Definir meta") + '</button>' +
        '<button class="btn btn-cheio" id="fin-nova">' + icone("mais") + 'Nova transacao</button>' +
      '</div>';

      html += '<div class="faixa-numeros">' +
        '<div class="num-item"><div class="num-valor">' + U.emReais(totalEntrou) + '</div>' +
          '<div class="num-rotulo">Entrou</div>' +
          (aReceber > 0 ? '<div class="num-extra">' + U.emReais(aReceber) + ' ainda vai entrar</div>' : "") + '</div>' +
        '<div class="num-item"><div class="num-valor">' + U.emReais(totalSaiu) + '</div>' +
          '<div class="num-rotulo">Saiu</div>' +
          (aPagar > 0 ? '<div class="num-extra">' + U.emReais(aPagar) + ' ainda vai sair</div>' : "") + '</div>' +
        '<div class="num-item"><div class="num-valor">' + U.emReais(saldo) + '</div>' +
          '<div class="num-rotulo">Sobrou no mes</div></div>' +
        '<div class="num-item"><div class="num-valor">' + (meta > 0 ? pctMeta + "%" : "sem meta") + '</div>' +
          '<div class="num-rotulo">Da sua meta</div>' +
          (meta > 0 ? '<div class="num-extra">meta de ' + U.emReais(meta) + '</div>' : "") + '</div>' +
      '</div>';

      /* barra da meta */
      if(meta > 0){
        html += '<div class="progresso-geral" style="margin-bottom:1.4rem">' +
          '<span>' + U.emReais(totalEntrou) + ' de ' + U.emReais(meta) + '</span>' +
          '<div class="barra-fundo"><div class="barra-cheia" style="width:' + pctMeta + '%"></div></div>' +
          '<span>' + pctMeta + '%</span></div>';
      }

      /* de onde vem o dinheiro */
      html += '<div class="duas-colunas">';
      html += '<div class="bloco"><div class="bloco-titulo">De onde veio o dinheiro</div>';
      if(categorias.length === 0){
        html += '<div class="vazio">Quando voce registrar a primeira entrada recebida, aparece aqui a divisao por categoria, mostrando de onde vem cada parte do seu faturamento.</div>';
      } else {
        var maiorCat = porCategoria[categorias[0]];
        html += '<div class="lista-origem">';
        categorias.forEach(function(c){
          var larg = Math.round(U.dividir(porCategoria[c], maiorCat) * 100);
          html += '<div>' +
            '<div class="origem-linha"><span>' + esc(c) + '</span><span>' + U.emReais(porCategoria[c]) + '</span></div>' +
            '<div class="barra-fundo" style="margin-top:0.25rem"><div class="barra-cheia" style="width:' + larg + '%"></div></div>' +
          '</div>';
        });
        html += '</div>';
      }
      html += '</div>';

      html += '<div class="bloco"><div class="bloco-titulo">Resumo do mes</div>' +
        '<div class="lista-origem">' +
          '<div class="origem-linha"><span>Transacoes</span><span>' + lista.length + '</span></div>' +
          '<div class="origem-linha"><span>Entradas</span><span>' + entradas.length + '</span></div>' +
          '<div class="origem-linha"><span>Saidas</span><span>' + saidas.length + '</span></div>' +
        '</div></div>';
      html += '</div>';

      /* filtros e tabela */
      html += '<div class="barra-acoes">' +
        '<button class="btn' + (filtroFin === "todas" ? " btn-cheio" : "") + '" data-ffin="todas">Todas</button>' +
        '<button class="btn' + (filtroFin === "entrada" ? " btn-cheio" : "") + '" data-ffin="entrada">Entradas</button>' +
        '<button class="btn' + (filtroFin === "saida" ? " btn-cheio" : "") + '" data-ffin="saida">Saidas</button>' +
        '<div class="cresce"></div>' +
        '<button class="btn" id="fin-csv">' + icone("baixar") + 'Baixar</button>' +
      '</div>';

      var visiveis = (filtroFin === "todas") ? lista : lista.filter(function(t){ return t.tipo === filtroFin; });

      if(todas.length === 0){
        html += blocoVazio("Voce ainda nao registrou nenhuma movimentacao. Clique em nova transacao para comecar a acompanhar o seu dinheiro.");
      } else if(visiveis.length === 0){
        html += blocoVazio("Nenhuma movimentacao neste mes com esse filtro.");
      } else {
        html += '<div class="rolagem"><table><thead><tr>' +
          '<th>Data</th><th>Descricao</th><th>Categoria</th><th>Marca</th><th>Situacao</th><th style="text-align:right">Valor</th>' +
          '</tr></thead><tbody>';
        visiveis.forEach(function(t){
          var ehEntrada = (t.tipo === "entrada");
          var pendente = (t.status === "pendente" || t.status === "a pagar");
          html += '<tr class="clicavel" data-id="' + esc(t.id) + '">' +
            '<td>' + esc(U.paraBR(t.data)) + '</td>' +
            '<td>' + esc(t.descricao || "sem descricao") + '</td>' +
            '<td>' + esc(t.categoria || "") + '</td>' +
            '<td>' + esc(t.cliente || "") + '</td>' +
            '<td><span class="pilula ' + (pendente ? "p-lead" : (ehEntrada ? "p-cliente" : "p-parada")) + '">' + esc(t.status) + '</span></td>' +
            '<td style="text-align:right;white-space:nowrap;color:' + (ehEntrada ? "var(--ok)" : "var(--erro)") + '">' +
              (ehEntrada ? "+ " : "- ") + esc(U.emReais(t.valor)) + '</td>' +
          '</tr>';
        });
        html += '</tbody></table></div>';
      }

      painel.innerHTML = html;

      document.getElementById("fin-antes").addEventListener("click", function(){
        var p = mesFinanceiro.split("-");
        var d = new Date(Number(p[0]), Number(p[1]) - 2, 1);
        mesFinanceiro = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        desenhar();
      });
      document.getElementById("fin-depois").addEventListener("click", function(){
        var p = mesFinanceiro.split("-");
        var d = new Date(Number(p[0]), Number(p[1]), 1);
        mesFinanceiro = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        desenhar();
      });
      document.getElementById("fin-hoje").addEventListener("click", function(){
        var d = new Date();
        mesFinanceiro = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        desenhar();
      });

      Array.prototype.forEach.call(painel.querySelectorAll("[data-ffin]"), function(b){
        b.addEventListener("click", function(){ filtroFin = b.getAttribute("data-ffin"); desenhar(); });
      });

      /* definir a meta do mes */
      document.getElementById("fin-meta").addEventListener("click", function(){
        var campos = [{ nome: "valor", rotulo: "Meta de faturamento para " + nomeMes(mesFinanceiro) + " (R$)", tipo: "number", passo: "0.01", padrao: meta }];
        abrirModal("Meta do mes", montarFormulario(campos, { valor: meta }) +
          '<div class="modal-botoes">' +
            '<button type="button" class="btn" id="btn-cancelar">Cancelar</button>' +
            '<button type="button" class="btn btn-cheio" id="btn-salvar">Salvar</button>' +
          '</div>');
        document.getElementById("btn-cancelar").addEventListener("click", fecharModal);
        document.getElementById("btn-salvar").addEventListener("click", async function(){
          var d = lerFormulario(campos);
          var r = await U.gravar("metas", function(q){
            return q.upsert({ mes: mesFinanceiro, valor: d.valor }, { onConflict: "mes" });
          });
          if(!r.ok){ falar(r.erro, true); return; }
          fecharModal();
          falar("Meta salva.");
          telaFinanceiro();
        });
      });

      /* nova transacao */
      document.getElementById("fin-nova").addEventListener("click", function(){
        abrirFormularioFinanceiro(null);
      });

      Array.prototype.forEach.call(painel.querySelectorAll("tr[data-id]"), function(tr){
        tr.addEventListener("click", function(){
          var t = todas.filter(function(x){ return String(x.id) === tr.getAttribute("data-id"); })[0];
          abrirFormularioFinanceiro(t);
        });
      });

      document.getElementById("fin-csv").addEventListener("click", function(){
        if(visiveis.length === 0){ falar("Nao ha nada para baixar.", true); return; }
        baixarCSV("meu-financeiro-" + mesFinanceiro + ".csv",
          ["Data","Tipo","Descricao","Categoria","Marca","Situacao","Valor"],
          visiveis.map(function(t){
            return [U.paraBR(t.data), t.tipo, t.descricao, t.categoria, t.cliente, t.status,
                    String(Number(t.valor) || 0).replace(".", ",")];
          })
        );
        falar("Arquivo baixado.");
      });
    }

    /* o formulario muda as categorias conforme entrada ou saida */
    function abrirFormularioFinanceiro(registro){
      var tipoAtual = registro ? registro.tipo : "entrada";
      var valores = registro || { data: hojeISO(), tipo: "entrada", status: "recebido" };

      function montar(){
        var campos = camposFinanceiro(tipoAtual);
        var html = montarFormulario(campos, valores) +
          '<div class="modal-botoes">' +
            (registro ? '<button type="button" class="btn btn-mini btn-perigo" id="btn-apagar">Apagar</button>' : "") +
            '<button type="button" class="btn" id="btn-cancelar">Cancelar</button>' +
            '<button type="button" class="btn btn-cheio" id="btn-salvar">Salvar</button>' +
          '</div>';
        abrirModal(registro ? "Editar transacao" : "Nova transacao", html);

        /* ao trocar entrada/saida, as categorias mudam junto */
        document.getElementById("f-tipo").addEventListener("change", function(e){
          valores = lerFormulario(campos);
          tipoAtual = e.target.value;
          valores.tipo = tipoAtual;
          valores.categoria = (tipoAtual === "saida") ? "Equipamento" : "UGC Creator";
          valores.status = (tipoAtual === "saida") ? "pago" : "recebido";
          montar();
        });

        document.getElementById("btn-cancelar").addEventListener("click", fecharModal);

        document.getElementById("btn-salvar").addEventListener("click", async function(){
          var dados = lerFormulario(campos);
          if(!dados.descricao){ falar("Escreva uma descricao.", true); return; }
          if(!dados.data){ falar("Escolha a data.", true); return; }
          var r;
          if(registro && registro.id){
            r = await U.gravar("financeiro", function(q){ return q.update(dados).eq("id", registro.id); });
          } else {
            r = await U.gravar("financeiro", function(q){ return q.insert(dados); });
          }
          if(!r.ok){ falar(r.erro, true); return; }
          fecharModal();
          falar("Salvo.");
          telaFinanceiro();
        });

        if(registro){
          document.getElementById("btn-apagar").addEventListener("click", async function(){
            if(!window.confirm("Apagar de vez? Isso nao volta.")) return;
            var r = await U.gravar("financeiro", function(q){ return q.delete().eq("id", registro.id); });
            if(!r.ok){ falar(r.erro, true); return; }
            fecharModal();
            falar("Apagado.");
            telaFinanceiro();
          });
        }
      }

      montar();
    }

    desenhar();
  }

  /* ============================================================
     PARTE 10: LIGAR TUDO
     ============================================================ */
  function iniciar(){
    document.getElementById("menu-email").textContent =
      (sessaoAtual && sessaoAtual.user && sessaoAtual.user.email) || "";

    document.getElementById("btn-sair").addEventListener("click", async function(){
      try { await U.sair(); } catch(err){ /* mesmo se falhar, sai da tela */ }
      window.location.replace("../login/");
    });

    montarMenu();
    irPara("portfolio");
  }

})();
</script>
</body>
