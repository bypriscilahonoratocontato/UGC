<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Priscila Honorato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo: #5B3039;
    --superficie: #4B2730;
    --cartao: #542C35;
    --destaque: #EDCBD0;
    --detalhe: #DFB8C0;
    --tinta: #FFF8F2;
    --tinta-suave: #EADCDE;
    --linha: rgba(255, 248, 242, 0.22);
    --linha-forte: rgba(255, 248, 242, 0.4);
    --suave: rgba(237, 203, 208, 0.14);
    --erro: #F2B8B5;
    --alerta: #F5D98B;
    --ok: #B7DFC4;
    --corpo: "Montserrat", sans-serif;
    --menu: 232px;
  }

  *,*::before,*::after{ box-sizing: border-box; }

  html, body{ height:100%; }

  body{
    margin:0;
    background: var(--fundo);
    color: var(--tinta);
    font-family: var(--corpo);
    font-weight: 300;
    font-size: 0.86rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* a pagina so aparece depois de conferir a sessao */
  #app{ display:none; }
  #checando{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    color: var(--tinta-suave);
    font-size: 0.82rem;
  }

  h1,h2,h3,h4{ font-weight: 500; margin: 0; letter-spacing: 0.01em; }
  p{ margin: 0 0 0.8em; color: var(--tinta-suave); }
  a{ color: inherit; }

  button{ font-family: var(--corpo); cursor: pointer; }

  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--destaque);
    outline-offset: 2px;
  }

  /* ===================== ESTRUTURA ===================== */
  .layout{ display:flex; min-height:100vh; }

  .menu{
    width: var(--menu);
    flex-shrink:0;
    background: var(--superficie);
    border-right: 1px solid var(--linha);
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0; bottom:0; left:0;
    z-index: 60;
  }
  .menu-topo{
    padding: 1.3rem 1.1rem 1rem;
    border-bottom: 1px solid var(--linha);
  }
  .menu-nome{ font-size: 0.92rem; font-weight: 500; }
  .menu-sub{
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--destaque);
    margin-top: 0.15rem;
  }

  .menu-lista{ flex:1; overflow-y:auto; padding: 0.9rem 0.6rem; }
  .menu-grupo{
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    opacity: 0.65;
    padding: 0.9rem 0.5rem 0.45rem;
  }
  .menu-item{
    display:flex;
    align-items:center;
    gap: 0.65rem;
    width:100%;
    padding: 0.62em 0.6em;
    background: transparent;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--tinta-suave);
    font-size: 0.82rem;
    text-align:left;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .menu-item:hover{ background: rgba(255,248,242,0.06); color: var(--tinta); }
  .menu-item.ativo{
    background: var(--suave);
    color: var(--destaque);
    border-left-color: var(--destaque);
    font-weight: 500;
  }
  .menu-item svg{ width:17px; height:17px; flex-shrink:0; }

  .menu-rodape{
    padding: 0.9rem 1.1rem 1.1rem;
    border-top: 1px solid var(--linha);
  }
  .menu-email{
    font-size: 0.68rem;
    color: var(--tinta-suave);
    word-break: break-all;
    margin-bottom: 0.6rem;
  }
  .btn-sair{
    display:flex;
    align-items:center;
    gap:0.5rem;
    width:100%;
    padding: 0.55em 0.7em;
    background: transparent;
    border: 1px solid var(--linha);
    color: var(--tinta-suave);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .btn-sair:hover{ border-color: var(--destaque); color: var(--destaque); }
  .btn-sair svg{ width:15px; height:15px; }

  .conteudo{
    flex:1;
    margin-left: var(--menu);
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .topo{
    display:flex;
    align-items:center;
    gap: 0.9rem;
    padding: 1rem clamp(1rem, 3vw, 1.8rem);
    border-bottom: 1px solid var(--linha);
    position:sticky;
    top:0;
    background: var(--fundo);
    z-index: 40;
  }
  .topo h1{ font-size: 1rem; }
  .topo-sub{ font-size: 0.72rem; color: var(--tinta-suave); }
  .abre-menu{
    display:none;
    width:36px; height:36px;
    background:transparent;
    border:1px solid var(--linha);
    color: var(--tinta);
    align-items:center;
    justify-content:center;
  }
  .abre-menu svg{ width:17px; height:17px; }

  .painel{ padding: clamp(1rem, 3vw, 1.8rem); flex:1; }

  .fundo-escuro{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(20, 8, 12, 0.55);
    z-index: 55;
  }
  .fundo-escuro.aparece{ display:block; }

  @media (max-width: 860px){
    .menu{ transform: translateX(-100%); transition: transform 0.25s ease; }
    .menu.aberto{ transform: translateX(0); }
    .conteudo{ margin-left: 0; }
    .abre-menu{ display:flex; }
  }

  /* ===================== PECAS COMUNS ===================== */
  .aviso{
    border: 1px solid var(--alerta);
    color: var(--alerta);
    background: rgba(245, 217, 139, 0.08);
    padding: 0.7em 0.9em;
    font-size: 0.78rem;
    margin-bottom: 1rem;
  }
  .aviso + .aviso{ margin-top: -0.5rem; }

  .vazio{
    border: 1px dashed var(--linha);
    padding: 1.4rem;
    text-align:center;
    color: var(--tinta-suave);
    font-size: 0.8rem;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap: 0.45rem;
    padding: 0.55em 1.1em;
    background: transparent;
    border: 1px solid var(--linha-forte);
    color: var(--tinta);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .btn:hover{ border-color: var(--destaque); color: var(--destaque); }
  .btn-cheio{
    background: var(--destaque);
    border-color: var(--destaque);
    color: var(--superficie);
    font-weight: 500;
  }
  .btn-cheio:hover{ opacity: 0.88; color: var(--superficie); }
  .btn svg{ width:14px; height:14px; }
  .btn-mini{ padding: 0.35em 0.6em; font-size: 0.66rem; letter-spacing: 0.06em; }

  .barra-acoes{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
  .barra-acoes .cresce{ flex:1; min-width: 160px; }

  input[type="text"], input[type="email"], input[type="date"],
  input[type="number"], input[type="search"], select, textarea{
    width:100%;
    padding: 0.5em 0.7em;
    background: var(--superficie);
    border: 1px solid var(--linha);
    color: var(--tinta);
    font-family: var(--corpo);
    font-size: 0.82rem;
    font-weight: 300;
  }
  textarea{ min-height: 82px; resize: vertical; }
  select option{ background: var(--superficie); color: var(--tinta); }
  input::placeholder, textarea::placeholder{ color: var(--tinta-suave); opacity: 0.6; }

  /* faixa de numeros */
  .faixa-numeros{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
    border: 1px solid var(--linha);
    margin-bottom: 1.3rem;
  }
  .num-item{
    padding: 0.85rem 1rem;
    border-right: 1px solid var(--linha);
  }
  .num-item:last-child{ border-right: 0; }
  .num-valor{
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--destaque);
    line-height: 1.2;
  }
  .num-rotulo{
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    margin-top: 0.15rem;
  }
  .num-extra{ font-size: 0.68rem; color: var(--tinta-suave); margin-top: 0.3rem; }
  @media (max-width: 700px){
    .num-item{ border-right:0; border-bottom: 1px solid var(--linha); }
  }

  /* tabelas */
  .rolagem{ overflow-x:auto; border: 1px solid var(--linha); }
  table{ width:100%; border-collapse: collapse; font-size: 0.8rem; }
  thead th{
    text-align:left;
    padding: 0.6em 0.75em;
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    border-bottom: 1px solid var(--linha);
    white-space: nowrap;
    background: var(--superficie);
  }
  tbody td{
    padding: 0.6em 0.75em;
    border-bottom: 1px solid var(--linha);
    vertical-align: middle;
  }
  tbody tr:last-child td{ border-bottom: 0; }
  tbody tr.clicavel:hover{ background: rgba(255,248,242,0.05); }

  th.ordenavel{ cursor: pointer; user-select:none; }
  th.ordenavel:hover{ color: var(--destaque); }
  th .seta{ opacity: 0.3; margin-left: 0.3rem; font-size: 0.7rem; }
  th.ordenando .seta{ opacity: 1; color: var(--destaque); }

  .acoes-linha{ display:flex; gap:0.3rem; justify-content:flex-end; }
  .icone-btn{
    width:26px; height:26px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:1px solid var(--linha);
    color: var(--tinta-suave);
  }
  .icone-btn:hover{ border-color: var(--destaque); color: var(--destaque); }
  .icone-btn svg{ width:13px; height:13px; }
  .icone-btn.apagado{ opacity: 0.45; }

  .alca{ cursor: grab; color: var(--tinta-suave); }
  .alca:active{ cursor: grabbing; }
  tr.arrastando{ opacity: 0.4; }
  tr.alvo td{ border-top: 2px solid var(--destaque); }

  /* pilulas */
  .pilula{
    display:inline-block;
    padding: 0.2em 0.6em;
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .p-lead{ color: #F5D98B; }
  .p-conversando{ color: #9FD0E8; }
  .p-cliente{ color: #B7DFC4; }
  .p-parada{ color: #D9C3C7; }
  .p-conteudo{ color: var(--destaque); }
  .p-publicidade{ color: #C9B6E8; }
  .p-status{ color: var(--detalhe); }
  .etiqueta-erro{ color: var(--erro); border-color: var(--erro); }
  .etiqueta-alerta{ color: var(--alerta); border-color: var(--alerta); }

  tr.favorita{ box-shadow: inset 3px 0 0 var(--destaque); }
  .estrela{ background:none; border:0; color: var(--linha-forte); font-size: 0.95rem; line-height:1; padding:0; }
  .estrela.on{ color: var(--alerta); }

  /* grafico */
  .grafico{
    display:flex;
    align-items:flex-end;
    gap: 4px;
    height: 132px;
    padding: 0.8rem;
    border: 1px solid var(--linha);
  }
  .barra-col{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; gap:5px; }
  .barra{ width:100%; background: var(--destaque); opacity: 0.85; min-height: 2px; }
  .barra-col:hover .barra{ opacity: 1; }
  .barra-dia{ font-size: 0.58rem; color: var(--tinta-suave); white-space:nowrap; }

  .duas-colunas{
    display:grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 1.1rem;
    margin-bottom: 1.4rem;
  }
  @media (max-width: 860px){ .duas-colunas{ grid-template-columns: 1fr; } }

  .bloco{ border: 1px solid var(--linha); padding: 0.9rem 1rem; }
  .bloco-titulo{
    font-size: 0.64rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    margin-bottom: 0.7rem;
  }
  .lista-origem{ display:flex; flex-direction:column; gap: 0.45rem; }
  .origem-linha{ display:flex; justify-content:space-between; gap:0.6rem; font-size: 0.78rem; }
  .origem-linha span:last-child{ color: var(--destaque); }

  /* calendario */
  .cal-topo{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: 0.6rem;
    margin-bottom: 0.9rem;
  }
  /* sem capitalize, senao o "de" de "setembro de 2026" fica maiusculo */
  .cal-mes{ font-size: 0.92rem; font-weight: 500; min-width: 165px; }
  .cal-grade{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    border: 1px solid var(--linha);
    border-right: 0;
    border-bottom: 0;
  }
  .cal-cabecalho{
    padding: 0.45em;
    text-align:center;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    background: var(--superficie);
    border-right: 1px solid var(--linha);
    border-bottom: 1px solid var(--linha);
  }
  .cal-dia{
    position:relative;
    min-height: 92px;
    padding: 0.35rem;
    border-right: 1px solid var(--linha);
    border-bottom: 1px solid var(--linha);
    cursor: pointer;
  }
  .cal-dia:hover{ background: rgba(255,248,242,0.04); }
  .cal-dia.fora{ opacity: 0.35; }
  .cal-dia.hoje{ background: var(--suave); }
  .cal-dia.hoje .cal-numero{ color: var(--destaque); font-weight: 600; }
  .cal-numero{ font-size: 0.7rem; color: var(--tinta-suave); margin-bottom: 0.25rem; }
  .cal-mais-btn{
    position:absolute;
    top: 0.25rem; right: 0.25rem;
    width:18px; height:18px;
    display:none;
    align-items:center;
    justify-content:center;
    background: var(--destaque);
    border:0;
    color: var(--superficie);
    font-size: 0.8rem;
    line-height:1;
  }
  .cal-dia:hover .cal-mais-btn{ display:flex; }
  .cal-item{
    display:block;
    width:100%;
    text-align:left;
    background: rgba(255,248,242,0.07);
    border:0;
    border-left: 2px solid var(--detalhe);
    color: var(--tinta);
    font-size: 0.64rem;
    padding: 0.18em 0.3em;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .cal-item.gravar{ border-left-color: #F5D98B; }
  .cal-item.editar{ border-left-color: #9FD0E8; }
  .cal-item.postar{ border-left-color: #B7DFC4; }
  .cal-item.prazo{ border-left-color: var(--erro); font-style: italic; }
  .cal-item.feito{ opacity: 0.5; text-decoration: line-through; }
  .cal-mais{ font-size: 0.6rem; color: var(--destaque); background:none; border:0; padding: 0.1em 0.3em; }
  @media (max-width: 700px){
    .cal-dia{ min-height: 66px; }
    .cal-item{ font-size: 0.55rem; }
  }

  .atrasados{ margin-top: 1.4rem; }
  .atraso-linha{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: 0.6rem;
    padding: 0.5em 0;
    border-bottom: 1px solid var(--linha);
    font-size: 0.8rem;
  }
  .atraso-linha:last-child{ border-bottom:0; }
  .atraso-dias{ color: var(--erro); font-size: 0.7rem; }

  /* sub abas */
  .sub-abas{
    display:flex;
    flex-wrap:wrap;
    gap: 0.4rem;
    border-bottom: 1px solid var(--linha);
    margin-bottom: 1.2rem;
  }
  .sub-aba{
    padding: 0.5em 0.9em;
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--tinta-suave);
    font-size: 0.76rem;
  }
  .sub-aba:hover{ color: var(--tinta); }
  .sub-aba.ativo{ color: var(--destaque); border-bottom-color: var(--destaque); }

  /* checklist */
  .progresso-geral{
    display:flex;
    align-items:center;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
    font-size: 0.78rem;
  }
  .barra-fundo{ flex:1; height: 5px; background: rgba(255,248,242,0.12); }
  .barra-cheia{ height:100%; background: var(--destaque); width:0%; transition: width 0.3s ease; }

  .secao{ border: 1px solid var(--linha); margin-bottom: 0.7rem; }
  .secao-cabecalho{
    display:flex;
    align-items:center;
    gap: 0.7rem;
    width:100%;
    padding: 0.75em 0.9em;
    background: transparent;
    border:0;
    color: var(--tinta);
    text-align:left;
  }
  .secao-cabecalho:hover{ background: rgba(255,248,242,0.04); }
  .secao-emoji{ font-size: 1rem; }
  .secao-nome{ font-weight: 500; font-size: 0.86rem; }
  .secao-resumo{ font-size: 0.72rem; color: var(--tinta-suave); }
  .secao-conta{ font-size: 0.7rem; color: var(--destaque); white-space:nowrap; }
  .secao-corpo{ display:none; padding: 0 0.9em 0.9em; }
  .secao.aberta .secao-corpo{ display:block; }
  .secao-porque{
    font-size: 0.78rem;
    color: var(--tinta-suave);
    border-left: 2px solid var(--detalhe);
    padding-left: 0.7rem;
    margin-bottom: 0.9rem;
  }
  .item-check{ display:flex; gap: 0.6rem; padding: 0.5em 0; border-top: 1px solid var(--linha); }
  .item-check input{ width:15px; height:15px; margin-top: 0.2rem; flex-shrink:0; accent-color: #EDCBD0; }
  .item-t{ font-size: 0.82rem; }
  .item-t.feito{ opacity: 0.55; text-decoration: line-through; }
  .item-d{ font-size: 0.72rem; color: var(--tinta-suave); }

  /* referencias */
  .grade-cartoes{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 0.9rem;
  }
  .cartao-ref{
    border: 1px solid var(--linha);
    background: transparent;
    padding: 0;
    text-align:left;
    color: var(--tinta);
    overflow:hidden;
  }
  .cartao-ref:hover{ border-color: var(--destaque); }
  .ref-capa{
    aspect-ratio: 9 / 16;
    background: linear-gradient(155deg, #784550 0%, var(--fundo) 55%, var(--superficie) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 2rem;
  }
  .cartao-ref.minha{ border-color: var(--linha-forte); }
  .ref-corpo{ padding: 0.6rem 0.7rem 0.8rem; }
  .ref-titulo{ font-size: 0.8rem; font-weight: 500; margin-bottom: 0.25rem; }
  .ref-meta{ font-size: 0.66rem; color: var(--tinta-suave); }
  .ref-capa{ position:relative; }
  .ref-selo{
    position:absolute;
    top: 0.45rem;
    left: 0.45rem;
    font-size: 0.56rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--destaque);
    border: 1px solid var(--destaque);
    padding: 0.2em 0.45em;
    background: rgba(20, 8, 12, 0.35);
  }
  .grupo-ref{
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    margin: 1.6rem 0 0.8rem;
  }
  .grupo-ref:first-child{ margin-top: 0; }

  .bloco-tempo{ display:flex; gap: 0.8rem; padding: 0.55em 0; border-top: 1px solid var(--linha); }
  .bloco-t{
    font-size: 0.66rem;
    color: var(--destaque);
    white-space:nowrap;
    min-width: 62px;
    padding-top: 0.15rem;
  }
  .bloco-o{ font-size: 0.8rem; }
  .bloco-o b{ font-weight: 500; }
  .bloco-o em{ color: var(--tinta-suave); }

  .lista-ideia{ padding: 0.45em 0; border-top: 1px solid var(--linha); font-size: 0.82rem; }
  .lista-gancho{ font-size: 0.75rem; color: var(--tinta-suave); font-style: italic; }

  /* modal */
  .modal-fundo{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(20, 8, 12, 0.65);
    z-index: 80;
    padding: 1.2rem;
    overflow-y:auto;
  }
  .modal-fundo.aberto{ display:flex; align-items:flex-start; justify-content:center; }
  .modal{
    background: var(--superficie);
    border: 1px solid var(--linha-forte);
    width:100%;
    max-width: 470px;
    margin: auto;
    padding: 1.3rem;
  }
  .modal-largo{ max-width: 660px; }
  .modal-topo{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 1rem;
    margin-bottom: 1rem;
  }

<script>
(function(){
  "use strict";

  /* ============================================================
     PARTE 1: PORTA DE ENTRADA
     Antes de qualquer coisa, confere se ha sessao aberta.
     Sem sessao, manda para o login e nem mostra a pagina.
     ============================================================ */
  var U = window.BancoUtil;
  var sessaoAtual = null;

  (async function porta(){
    if(!window.sb){
      document.getElementById("checando").textContent =
        "Nao consegui carregar a conexao com o banco. Recarregue a pagina.";
      return;
    }
    sessaoAtual = await U.sessao();
    if(!sessaoAtual || sessaoAtual.user.email !== window.BANCO.emailDona){
      window.location.replace("../login/");
      return;
    }
    /* Segunda conferencia: mesmo logada, so a dona entra. */
    var emailEntrou = (sessaoAtual.user && sessaoAtual.user.email) || "";
    if(emailEntrou !== window.BANCO.emailDona){
      try { await U.sair(); } catch(err){ /* segue para o login assim mesmo */ }
      window.location.replace("../login/");
      return;
    }
    document.getElementById("checando").style.display = "none";
    document.getElementById("app").style.display = "block";
    window.sb.auth.onAuthStateChange(function(event,session){if(!session){document.getElementById("app").style.display="none";window.location.replace("../login/");}});
    iniciar();
  })();

  /* ============================================================
     PARTE 2: FERRAMENTAS DE TELA
     ============================================================ */
  var painel      = document.getElementById("painel");
  var tituloAba   = document.getElementById("titulo-aba");
  var subAba      = document.getElementById("sub-aba");
  var modalFundo  = document.getElementById("modal-fundo");
  var modalCaixa  = document.getElementById("modal");
  var modalTitulo = document.getElementById("modal-titulo");
  var modalCorpo  = document.getElementById("modal-corpo");
  var recado      = document.getElementById("recado");
  var menu        = document.getElementById("menu");
  var fundoEscuro = document.getElementById("fundo-escuro");

  var esc = U.escapar;
  var recadoTempo = null;

  function falar(texto, ruim){
    recado.textContent = texto;
    recado.className = "recado aparece" + (ruim ? " ruim" : "");
    if(recadoTempo) clearTimeout(recadoTempo);
    recadoTempo = setTimeout(function(){ recado.className = "recado" + (ruim ? " ruim" : ""); }, 3200);
  }

  function abrirModal(titulo, html, largo){
    modalTitulo.textContent = titulo;
    modalCorpo.innerHTML = html;
    modalCaixa.className = "modal" + (largo ? " modal-largo" : "");
    modalFundo.classList.add("aberto");
  }
  function fecharModal(){
    modalFundo.classList.remove("aberto");
    modalCorpo.innerHTML = "";
  }
  document.getElementById("modal-fechar").addEventListener("click", fecharModal);
  modalFundo.addEventListener("click", function(e){ if(e.target === modalFundo) fecharModal(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && modalFundo.classList.contains("aberto")) fecharModal();
  });

  function icone(nome){
    var caminhos = {
      portfolio: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
      marcas:    '<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M10 21v-6h4v6"/>',
      calendario:'<rect x="3" y="4" width="18" height="18" rx="1"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
      campanhas: '<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M18 8a5 5 0 0 1 0 8"/>',
      checklist: '<polyline points="9 11 12 14 20 6"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h10"/>',
      ideias:    '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a6 6 0 0 0-4 10.5c.6.7 1 1.5 1 2.5h6c0-1 .4-1.8 1-2.5A6 6 0 0 0 12 2z"/>',
      dinheiro:  '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>',
      sobe:      '<polyline points="18 9 12 15 6 9"/>',
      mais:      '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      lapis:     '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
      lixo:      '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
      olho:      '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
      olhoOff:   '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>',
      baixar:    '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
      subir:     '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 8 12 3 17 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
      zap:       '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 20.5l1.6-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>',
      link:      '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
      arrasta:   '<circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/>',
      esquerda:  '<polyline points="15 18 9 12 15 6"/>',
      direita:   '<polyline points="9 18 15 12 9 6"/>'
    };
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
           (caminhos[nome] || "") + '</svg>';
  }

  function blocoAviso(texto){
    return texto ? '<div class="aviso">' + esc(texto) + '</div>' : "";
  }
  function blocoVazio(texto){
    return '<div class="vazio">' + esc(texto) + '</div>';
  }

  /* Linha de explicacao embaixo do titulo do campo. */
  function dicaDoCampo(c){
    return c.dica ? '<div class="campo-dica">' + esc(c.dica) + '</div>' : "";
  }

  /* Formulario generico usado por videos, marcas, calendario, campanhas e ideias */
  function montarFormulario(campos, valores){
    valores = valores || {};
    var html = '<form id="form-modal">';
    campos.forEach(function(c){
      var v = valores[c.nome];
      if(v === null || v === undefined) v = (c.padrao !== undefined ? c.padrao : "");
      if(c.tipo === "checkbox"){
        html += '<div class="modal-campo"><div class="modal-linha-check">' +
                '<input type="checkbox" id="f-' + c.nome + '" name="' + c.nome + '"' + (v ? " checked" : "") + '>' +
                '<label for="f-' + c.nome + '">' + esc(c.rotulo) + '</label></div></div>';
      } else if(c.tipo === "select"){
        html += '<div class="modal-campo"><label for="f-' + c.nome + '">' + esc(c.rotulo) + '</label>' + dicaDoCampo(c) +
                '<select id="f-' + c.nome + '" name="' + c.nome + '">';
        c.opcoes.forEach(function(op){
          var valor = (typeof op === "object") ? op.valor : op;
          var texto = (typeof op === "object") ? op.texto : op;
          html += '<option value="' + esc(valor) + '"' + (String(v) === String(valor) ? " selected" : "") + '>' + esc(texto) + '</option>';
        });
        html += '</select></div>';
      } else if(c.tipo === "textarea"){
        html += '<div class="modal-campo"><label for="f-' + c.nome + '">' + esc(c.rotulo) + '</label>' + dicaDoCampo(c) +
                '<textarea id="f-' + c.nome + '" name="' + c.nome + '"' +
                (c.alto ? ' style="min-height:150px"' : "") +
                (c.exemplo ? ' placeholder="' + esc(c.exemplo) + '"' : "") + '>' + esc(v) + '</textarea></div>';
      } else {
        html += '<div class="modal-campo"><label for="f-' + c.nome + '">' + esc(c.rotulo) + '</label>' + dicaDoCampo(c) +
                '<input type="' + (c.tipo || "text") + '" id="f-' + c.nome + '" name="' + c.nome + '" value="' + esc(v) + '"' +
                (c.exemplo ? ' placeholder="' + esc(c.exemplo) + '"' : "") +
                (c.passo ? ' step="' + c.passo + '"' : "") + '></div>';
      }
    });
    html += '</form>';
    return html;
  }

  function lerFormulario(campos){
    var form = document.getElementById("form-modal");
    var dados = {};
    campos.forEach(function(c){
      var el = form.elements[c.nome];
      if(!el) return;
      if(c.tipo === "checkbox") dados[c.nome] = el.checked;
      else if(c.tipo === "number") dados[c.nome] = el.value === "" ? 0 : Number(el.value);
      else if(c.tipo === "date") dados[c.nome] = el.value || null;
      else dados[c.nome] = el.value.trim();
    });
    return dados;
  }

  /* Abre o formulario de uma tabela qualquer e salva no banco */
  function abrirFormulario(opcoes){
    var campos = opcoes.campos;
    var registro = opcoes.registro || null;
    var html = montarFormulario(campos, registro) +
      '<div class="modal-botoes">' +
        (registro && registro.id ? '<button type="button" class="btn btn-mini btn-perigo" id="btn-apagar">Apagar</button>' : "") +
        '<button type="button" class="btn" id="btn-cancelar">Cancelar</button>' +
        '<button type="button" class="btn btn-cheio" id="btn-salvar">Salvar</button>' +
      '</div>';

    abrirModal(opcoes.titulo, html);

    document.getElementById("btn-cancelar").addEventListener("click", fecharModal);

    document.getElementById("btn-salvar").addEventListener("click", async function(){
      if(this.disabled)return;
      if(!document.getElementById("form-modal").reportValidity())return;
      var dados = lerFormulario(campos);
      if(opcoes.tabela==="videos" && dados.link && !U.urlSegura(dados.link)){falar("Use um link começando por https://",true);return;}
      if(opcoes.tabela==="campanhas" && (!Number.isInteger(dados.qtd)||dados.qtd<1||dados.valor<0)){falar("A quantidade deve ser inteira e maior que zero. O valor não pode ser negativo.",true);return;}
      if(opcoes.antesDeSalvar){
        var problema = opcoes.antesDeSalvar(dados);
        if(problema){ falar(problema, true); return; }
      }
      this.disabled=true;
      var r;
      if(registro && registro.id){
        r = await U.gravar(opcoes.tabela, function(q){ return q.update(dados).eq("id", registro.id); });
      } else {
        r = await U.gravar(opcoes.tabela, function(q){ return q.insert(dados); });
      }
      if(!r.ok){ this.disabled=false; falar(r.erro, true); return; }
      fecharModal();
      falar("Salvo.");
      if(opcoes.depois) opcoes.depois();
    });

    if(registro && registro.id){
      document.getElementById("btn-apagar").addEventListener("click", async function(){
        if(!window.confirm("Apagar de vez? Isso nao volta.")) return;
        var r = await U.gravar(opcoes.tabela, function(q){ return q.delete().eq("id", registro.id); });
        if(!r.ok){ falar(r.erro, true); return; }
        fecharModal();
        falar("Apagado.");
        if(opcoes.depois) opcoes.depois();
      });
    }
  }

  /* Baixar CSV que abre certo no Excel, com acento */
  function baixarCSV(nomeArquivo, cabecalhos, linhas){
    var sep = ";";
    var texto = cabecalhos.join(sep) + "\r\n";
    linhas.forEach(function(linha){
      texto += linha.map(function(celula){
        var t = String(celula === null || celula === undefined ? "" : celula).replace(/"/g, '""');
        if(/^[=+@\-\t\r]/.test(t))t="'"+t;
        return '"' + t + '"';
      }).join(sep) + "\r\n";
    });
    var blob = new Blob(["﻿" + texto], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }

  /* ------------------------------------------------------------
     LER PLANILHA (CSV colado ou em arquivo)
     ------------------------------------------------------------ */

  /* Tira acento, maiuscula e pontuacao, para comparar textos com folga. */
  function semAcento(texto){
    var t = String(texto === null || texto === undefined ? "" : texto);
    if(t.normalize) t = t.normalize("NFD").replace(/[̀-ͯ]/g, "");
    return t.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  }

  /* Descobre sozinho se a planilha usa ponto e virgula, virgula ou tabulacao. */
  function separadorDaPlanilha(texto){
    var primeira = String(texto).split(/\r?\n/)[0] || "";
    var contas = { ";": 0, ",": 0, "\t": 0 };
    var aspas = false;
    for(var i = 0; i < primeira.length; i++){
      var c = primeira.charAt(i);
      if(c === '"') aspas = !aspas;
      else if(!aspas && contas[c] !== undefined) contas[c]++;
    }
    var melhor = ";", maior = 0;
    Object.keys(contas).forEach(function(s){ if(contas[s] > maior){ maior = contas[s]; melhor = s; } });
    return maior > 0 ? melhor : ";";
  }

  /* Devolve a planilha como lista de linhas, cada linha uma lista de celulas. */
  function lerPlanilha(texto){
    texto = String(texto || "").replace(/^﻿/, "");
    var sep = separadorDaPlanilha(texto);
    var linhas = [], atual = [], campo = "", aspas = false;
    for(var i = 0; i < texto.length; i++){
      var c = texto.charAt(i);
      if(aspas){
        if(c === '"'){
          if(texto.charAt(i + 1) === '"'){ campo += '"'; i++; }
          else aspas = false;
        } else campo += c;
      } else if(c === '"'){
        aspas = true;
      } else if(c === sep){
        atual.push(campo); campo = "";
      } else if(c === "\n"){
        atual.push(campo); linhas.push(atual); atual = []; campo = "";
      } else if(c !== "\r"){
        campo += c;
      }
    }
    atual.push(campo);
    linhas.push(atual);
    return linhas
      .map(function(l){ return l.map(function(cel){ return String(cel).replace(/^'/, "").trim(); }); })
      .filter(function(l){ return l.join("") !== ""; });
  }

  /* Le o arquivo respeitando o acento, mesmo quando o Excel salvou no padrao antigo. */
  function lerArquivoTexto(arquivo){
    return new Promise(function(resolve, reject){
      var leitor = new FileReader();
      leitor.onerror = function(){ reject(new Error("Nao consegui abrir o arquivo.")); };
      leitor.onload = function(){
        try {
          var bytes = new Uint8Array(leitor.result);
          if(bytes[0] === 0x50 && bytes[1] === 0x4B){
            reject(new Error("Esse arquivo e do Excel (xlsx). No Excel, use Arquivo, Salvar como e escolha CSV."));
            return;
          }
          var texto = "";
          if(window.TextDecoder){
            texto = new TextDecoder("utf-8").decode(bytes);
            if(texto.indexOf("�") >= 0){
              try { texto = new TextDecoder("windows-1252").decode(bytes); } catch(e2){}
            }
          } else {
            texto = String.fromCharCode.apply(null, bytes);
          }
          resolve(texto);
        } catch(err){
          reject(new Error("Nao consegui ler o conteudo do arquivo."));
        }
      };

  /* Converte 1.500,00 ou R$ 1500 em numero. */
  function numeroDaPlanilha(valor){
    var t = String(valor === null || valor === undefined ? "" : valor).replace(/[^\d,.\-]/g, "");
    if(!t) return 0;
    if(t.indexOf(",") >= 0) t = t.replace(/\./g, "").replace(",", ".");
    var n = Number(t);
    return isFinite(n) ? n : 0;
  }

  /* Converte 12/03/2025, 12-03-25 ou 2025-03-12 na data do banco. */
  function dataDaPlanilha(valor){
    var t = String(valor === null || valor === undefined ? "" : valor).trim();
    if(!t) return null;
    var m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m){
      var ano = m[3].length === 2 ? "20" + m[3] : m[3];
      var mes = ("0" + m[2]).slice(-2), dia = ("0" + m[1]).slice(-2);
      if(Number(mes) < 1 || Number(mes) > 12 || Number(dia) < 1 || Number(dia) > 31) return null;
      return ano + "-" + mes + "-" + dia;
    }
    m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2);
    return null;
  }

    var a = new Date(String(isoA).slice(0,10) + "T00:00:00");
    var b = new Date(String(isoB).slice(0,10) + "T00:00:00");
    if(isNaN(a.getTime()) || isNaN(b.getTime())) return null;
    return Math.round((a - b) / 86400000);
  }

          var r = await U.gravar("videos", function(q){ return q.update({ ordem: i + 1 }).eq("id", ids[i]); });

      tr.addEventListener("dragover", function(e){
        e.preventDefault();
        if(!arrastando || arrastando === tr) return;
        Array.prototype.forEach.call(corpo.querySelectorAll("tr"), function(x){ x.classList.remove("alvo"); });
        tr.classList.add("alvo");

        var meio = caixa.top + caixa.height / 2;
        if(e.clientY < meio) corpo.insertBefore(arrastando, tr);
        else corpo.insertBefore(arrastando, tr.nextSibling);
      });

  var COLUNAS_MARCA = [

  /* Olha a linha de titulos e chuta qual coluna e qual campo.
     Ganha sempre a dica mais especifica, para "data do proximo contato"
     nao virar "ultimo contato" so porque tem a palavra data.
     As dicas "fracas" sao palavras genericas, tipo contato, que so
     valem quando nenhum outro campo combinou melhor com a coluna. */
  /* Deixa singular para "Anotacoes" achar "anotacao" e "Detalhes" achar "detalhe". */
  function chaveDeColuna(texto){
    return semAcento(texto).split(" ").map(function(p){
      p = p.replace(/coes$/, "cao").replace(/oes$/, "ao").replace(/ais$/, "al").replace(/eis$/, "el");
      if(p.length > 3 && p.charAt(p.length - 1) === "s") p = p.slice(0, -1);
      return p;
    }).join(" ").trim();
  }

  function adivinharColunas(cabecalho){
    var pares = [];
    cabecalho.forEach(function(titulo, indice){
      var t = chaveDeColuna(titulo);
      if(!t) return;
      COLUNAS_MARCA.forEach(function(c){
        var melhor = 0;
        function pesar(dica, teto){
          var d = chaveDeColuna(dica);
          var ponto = 0;
          if(t === d) ponto = 3;
          else if((" " + t + " ").indexOf(" " + d + " ") >= 0) ponto = 2;
          else if(t.indexOf(d) >= 0 || d.indexOf(t) >= 0) ponto = 1;
          if(ponto > teto) ponto = teto;
          if(ponto > 0) melhor = Math.max(melhor, ponto * 100 + d.length);
        }
        c.dicas.forEach(function(d){ pesar(d, 3); });
        (c.fracas || []).forEach(function(d){ pesar(d, 1); });
        if(melhor > 0) pares.push({ campo: c.campo, indice: indice, nota: melhor });
      });
    });
    pares.sort(function(a, b){ return b.nota - a.nota || a.indice - b.indice; });
    var mapa = {}, usados = {};
    pares.forEach(function(p){
      if(mapa[p.campo] !== undefined || usados[p.indice]) return;
      mapa[p.campo] = p.indice;
      usados[p.indice] = true;
    });
    return mapa;
  }

  /* Transforma uma linha da planilha numa marca do jeito que o banco espera. */
  function linhaParaMarca(linha, mapa){
    function pega(campo){
      var i = mapa[campo];
      if(i === undefined || i === null || i < 0) return "";
      return String(linha[i] === undefined ? "" : linha[i]).trim();
    }

    var insta = pega("instagram");
    var achou = insta.match(/instagram\.com\/([^\/?#\s]+)/i);
    if(achou) insta = achou[1];
    insta = insta.replace(/^@+/, "").replace(/\/+$/, "").replace(/\s+/g, "");

    var email = (pega("email").toLowerCase().split(/[\s,;]+/)[0] || "");
    if(email.indexOf("@") < 0) email = "";

    /* A negativa vem primeiro, senao "nao respondeu" viraria "respondeu". */
    var sit = semAcento(pega("situacao"));
    var situacao = "lead";
    if(/(^| )nao( |$)|parad|perdid|recus|sem retorno|sem resposta|encerrad|descartad|arquivad|desistiu|ignor|frio/.test(sit)) situacao = "parada";
    else if(/client|fechad|aprovad|parceria|contratad|ativa/.test(sit)) situacao = "cliente";
    else if(/convers|negoci|proposta|andamento|aberto|respondeu|falando|contato feito|retorn/.test(sit)) situacao = "conversando";

    return {
      nome:             pega("nome"),
      responsavel:      pega("responsavel"),
      instagram:        insta ? "@" + insta : "",
      email:            email,
      telefone:         pega("telefone"),
      situacao:         situacao,
      valor_potencial:  numeroDaPlanilha(pega("valor_potencial")),
      ultimo_contato:   dataDaPlanilha(pega("ultimo_contato")),
      proximo_followup: dataDaPlanilha(pega("proximo_followup")),
      obs:              pega("obs"),
      notas_internas:   pega("notas_internas")
    };
  }

  /* Tela de importar, em dois passos: escolher o arquivo e conferir. */
  function abrirImportarMarcas(jaExistentes, depois){
    var textoDoArquivo = "";

    var html =
      '<div class="imp-texto">' +
        'Suba aqui a sua planilha de marcas em <strong>CSV</strong> e eu jogo tudo para dentro da aba Marcas.<br>' +
        'No Excel ou no Google Planilhas: Arquivo, depois Baixar ou Salvar como, e escolha <strong>CSV</strong>.<br>' +
        'A primeira linha precisa ter o titulo de cada coluna. Eu descubro sozinha o que e nome, e-mail, telefone e o resto, e voce confere tudo antes de gravar.' +
      '</div>' +
      '<div class="imp-area" id="imp-area">' +
        '<input type="file" id="imp-arquivo" accept=".csv,.txt,text/csv,text/plain">' +
        '<button type="button" class="btn btn-cheio" id="imp-escolher">Escolher a planilha</button>' +
        '<p>ou arraste o arquivo para dentro desta caixa</p>' +
        '<div class="imp-nome-arquivo" id="imp-nome"></div>' +
      '</div>' +
      '<div class="modal-campo"><label for="imp-colar">Ou cole aqui as linhas copiadas direto da planilha</label>' +
        '<textarea id="imp-colar" rows="4" placeholder="Cole com a linha de titulos em cima"></textarea></div>' +
      '<div class="modal-botoes">' +
        '<button type="button" class="btn btn-mini" id="imp-modelo" style="margin-right:auto">Baixar planilha modelo</button>' +
        '<button type="button" class="btn" id="imp-cancelar">Cancelar</button>' +
        '<button type="button" class="btn btn-cheio" id="imp-continuar">Continuar</button>' +
      '</div>';

    abrirModal("Importar planilha de marcas", html, true);

    var area      = document.getElementById("imp-area");
    var entrada   = document.getElementById("imp-arquivo");
    var nomeAlvo  = document.getElementById("imp-nome");
    var colar     = document.getElementById("imp-colar");

    document.getElementById("imp-escolher").addEventListener("click", function(){ entrada.click(); });
    document.getElementById("imp-cancelar").addEventListener("click", fecharModal);

    document.getElementById("imp-modelo").addEventListener("click", function(){
      baixarCSV("modelo-marcas.csv",
        ["Marca","Quem cuida do assunto la","Instagram","E-mail","Telefone","Situacao","Pode render","Ultimo contato","Voltar a falar","Observacao"],
        [["Nome da marca","Nome da pessoa","@perfildamarca","contato@marca.com.br","32988887777","Lead","1500,00","01/09/2026","15/09/2026","Onde voce conheceu essa marca"]]
      );
      falar("Modelo baixado. Preencha e volte aqui.");
    });

    async function receberArquivo(arquivo){
      if(!arquivo) return;
      nomeAlvo.textContent = "Lendo " + arquivo.name + "...";
      try {
        textoDoArquivo = await lerArquivoTexto(arquivo);
        nomeAlvo.textContent = arquivo.name;
        colar.value = "";
      } catch(err){
        textoDoArquivo = "";
        nomeAlvo.textContent = "";
        falar(err.message, true);
      }
    }

    entrada.addEventListener("change", function(){ receberArquivo(entrada.files[0]); });

    ["dragenter","dragover"].forEach(function(evento){
      area.addEventListener(evento, function(e){ e.preventDefault(); area.classList.add("por-cima"); });
    });
    ["dragleave","drop"].forEach(function(evento){
      area.addEventListener(evento, function(e){ e.preventDefault(); area.classList.remove("por-cima"); });
    });
    area.addEventListener("drop", function(e){
      if(e.dataTransfer && e.dataTransfer.files) receberArquivo(e.dataTransfer.files[0]);
    });

    document.getElementById("imp-continuar").addEventListener("click", function(){
      var bruto = textoDoArquivo || colar.value;
      if(!String(bruto).trim()){ falar("Escolha a planilha ou cole as linhas primeiro.", true); return; }
      var linhas = lerPlanilha(bruto);
      if(linhas.length < 2){ falar("Preciso da linha de titulos e de pelo menos uma marca embaixo.", true); return; }
      passoConferir(linhas);
    });

    /* Passo dois: mostra o que entendeu, deixa corrigir e grava. */
    function passoConferir(linhas){
      var cabecalho = linhas[0];
      var corpo     = linhas.slice(1);
      var mapa      = adivinharColunas(cabecalho);
      var pular     = true;

      var existentes = {};
      (jaExistentes || []).forEach(function(m){
        var n = semAcento(m.nome);
        if(n) existentes["n:" + n] = true;
        var e = String(m.email || "").toLowerCase().trim();
        if(e) existentes["e:" + e] = true;
      });

      function preparar(){
        var vistos = {}, novas = [], repetidas = 0, semNome = 0;
        corpo.forEach(function(linha){
          var m = linhaParaMarca(linha, mapa);
          if(!m.nome){ semNome++; return; }
          var chaveN = "n:" + semAcento(m.nome);
          var chaveE = m.email ? "e:" + m.email : "";
          var repetida = vistos[chaveN] || (chaveE && vistos[chaveE]) ||
                         existentes[chaveN] || (chaveE && existentes[chaveE]);
          vistos[chaveN] = true;
          if(chaveE) vistos[chaveE] = true;
          if(repetida){
            repetidas++;
            if(pular) return;
          }
          novas.push(m);
        });
        return { novas: novas, repetidas: repetidas, semNome: semNome };
      }

      function desenharConferir(){
        var r = preparar();

        function opcoesColuna(escolhida){
          var s = '<option value="-1">nao usar</option>';
          cabecalho.forEach(function(t, i){
            s += '<option value="' + i + '"' + (Number(escolhida) === i ? " selected" : "") + '>' +
                 esc(t || ("coluna " + (i + 1))) + '</option>';
          });
          return s;
        }

        var h = '<div class="imp-texto">Li <strong>' + corpo.length + ' linha' + (corpo.length === 1 ? "" : "s") + '</strong> da sua planilha. ' +
                'Confira se cada coluna caiu no campo certo. Se alguma estiver trocada, e so mudar aqui embaixo.</div>';

        h += '<div class="imp-mapa">';
        COLUNAS_MARCA.forEach(function(c){
          h += '<div><label for="map-' + c.campo + '">' + esc(c.rotulo) + '</label>' +
               '<select id="map-' + c.campo + '" data-campo="' + c.campo + '">' +
               opcoesColuna(mapa[c.campo] === undefined ? -1 : mapa[c.campo]) + '</select></div>';
        });
        h += '</div>';

        h += '<div class="imp-resumo">' +
          '<span class="pilula">' + r.novas.length + ' para importar</span>' +
          (r.repetidas ? '<span class="pilula etiqueta-alerta">' + r.repetidas +
            (r.repetidas === 1 ? ' ja esta na base' : ' ja estao na base') + '</span>' : "") +
          (r.semNome ? '<span class="pilula etiqueta-erro">' + r.semNome +
            (r.semNome === 1 ? ' linha sem nome de marca' : ' linhas sem nome de marca') + '</span>' : "") +
        '</div>';

        h += '<div class="modal-campo"><div class="modal-linha-check">' +
          '<input type="checkbox" id="imp-pular"' + (pular ? " checked" : "") + '>' +
          '<label for="imp-pular">Nao importar quem ja esta na minha base</label></div></div>';

        if(r.novas.length > 0){
          var mostrar = r.novas.slice(0, 6);
          h += '<div class="rolagem imp-previa"><table><thead><tr>' +
            '<th>Marca</th><th>Quem cuida</th><th>Instagram</th><th>E-mail</th><th>Telefone</th><th>Situacao</th><th>Pode render</th>' +
            '</tr></thead><tbody>';
          mostrar.forEach(function(m){
            var s = SITUACOES.filter(function(x){ return x.valor === m.situacao; })[0];
            h += '<tr>' +
              '<td>' + esc(m.nome) + '</td>' +
              '<td>' + esc(m.responsavel) + '</td>' +
              '<td>' + esc(m.instagram) + '</td>' +
              '<td>' + esc(m.email) + '</td>' +
              '<td>' + esc(m.telefone) + '</td>' +
              '<td><span class="pilula p-' + esc(m.situacao) + '">' + esc(s ? s.texto : m.situacao) + '</span></td>' +
              '<td>' + (m.valor_potencial > 0 ? esc(U.emReais(m.valor_potencial)) : "") + '</td>' +
            '</tr>';
          });
          h += '</tbody></table></div>';
          if(r.novas.length > mostrar.length){
            h += '<div class="imp-rodape">Estou mostrando as ' + mostrar.length + ' primeiras. As outras ' +
                 (r.novas.length - mostrar.length) + ' entram do mesmo jeito.</div>';
          }
        } else {
          h += blocoVazio("Nao sobrou nenhuma linha para importar. Confira se a coluna da marca esta escolhida certo aqui em cima.");
        }

        h += '<div class="modal-botoes">' +
          '<button type="button" class="btn btn-mini" id="imp-voltar" style="margin-right:auto">Escolher outra planilha</button>' +
          '<button type="button" class="btn" id="imp-cancelar2">Cancelar</button>' +
          '<button type="button" class="btn btn-cheio" id="imp-gravar"' + (r.novas.length ? "" : " disabled") + '>' +
            'Importar ' + r.novas.length + ' marca' + (r.novas.length === 1 ? "" : "s") + '</button>' +
        '</div>';

        abrirModal("Conferir antes de importar", h, true);

        Array.prototype.forEach.call(modalCorpo.querySelectorAll("[data-campo]"), function(sel){
          sel.addEventListener("change", function(){
            var campo = sel.getAttribute("data-campo");
            var valor = Number(sel.value);
            if(valor < 0){
              delete mapa[campo];
            } else {
              Object.keys(mapa).forEach(function(k){ if(k !== campo && mapa[k] === valor) delete mapa[k]; });
              mapa[campo] = valor;
            }
            desenharConferir();
          });
        });

        document.getElementById("imp-pular").addEventListener("change", function(e){
          pular = e.target.checked;
          desenharConferir();
        });

        document.getElementById("imp-voltar").addEventListener("click", function(){
          abrirImportarMarcas(jaExistentes, depois);
        });
        document.getElementById("imp-cancelar2").addEventListener("click", fecharModal);

        var botao = document.getElementById("imp-gravar");
        botao.addEventListener("click", async function(){
          var lista = preparar().novas;
          if(lista.length === 0) return;
          botao.disabled = true;
          var gravadas = 0, falha = null;
          for(var i = 0; i < lista.length; i += 100){
            var lote = lista.slice(i, i + 100);
            botao.textContent = "Gravando " + (i + lote.length) + " de " + lista.length;
            var res = await U.gravar("marcas", function(q){ return q.insert(lote); });
            if(!res.ok){ falha = res.erro; break; }
            gravadas += lote.length;
          }
          fecharModal();
          if(falha) falar("Importei " + gravadas + " e parei. " + falha, true);
          else falar(gravadas + (gravadas === 1 ? " marca importada." : " marcas importadas."));
          if(depois) depois();
        });
      }

      desenharConferir();
    }
  }

  var marcasBusca = "", marcasFiltro = "todas";

  async function telaMarcas(){
    var r = await U.ler("marcas", function(q){ return q.order("criado_em", { ascending: false }); });
    if(abaAtual!=="marcas")return;
    var todas = r.dados;

    function filtrar(){
      var busca = marcasBusca.toLowerCase();
      return todas.filter(function(m){
        if(marcasFiltro !== "todas" && m.situacao !== marcasFiltro) return false;
        if(!busca) return true;
        return (String(m.nome || "") + " " + String(m.instagram || "") + " " + String(m.email || "")).toLowerCase().indexOf(busca) >= 0;
      });
    }

    function desenhar(){
      var lista = filtrar();
      var hoje = hojeISO();
      var html = "";
      html += blocoAviso(r.erro);

      /* numeros do acompanhamento comercial */
      var clientes  = todas.filter(function(m){ return m.situacao === "cliente"; }).length;
      var noPipe    = todas.filter(function(m){ return m.situacao === "lead" || m.situacao === "conversando"; });
      var potencial = noPipe.reduce(function(s, m){ return s + (Number(m.valor_potencial) || 0); }, 0);

      var esperando = todas.filter(function(m){
        var f = String(m.proximo_followup || "").slice(0, 10);
        return f && f <= hoje && m.situacao !== "cliente" && m.situacao !== "parada";
      }).sort(function(a, b){ return String(a.proximo_followup).localeCompare(String(b.proximo_followup)); });

      html += '<div class="faixa-numeros">' +
        '<div class="num-item"><div class="num-valor">' + clientes + '</div><div class="num-rotulo">Ja sao clientes</div></div>' +
        '<div class="num-item"><div class="num-valor">' + noPipe.length + '</div><div class="num-rotulo">Em conversa</div></div>' +
        '<div class="num-item"><div class="num-valor">' + esperando.length + '</div><div class="num-rotulo">Esperando voce</div></div>' +
        '<div class="num-item"><div class="num-valor">' + U.emReais(potencial) + '</div><div class="num-rotulo">Pode render</div>' +
          '<div class="num-extra">somando quem ainda esta em conversa</div></div>' +
      '</div>';

      /* quem esta esperando resposta */
      if(esperando.length > 0){
        html += '<div class="bloco" style="margin-bottom:1.3rem">' +
          '<div class="bloco-titulo">Voce combinou de voltar a falar</div>';
        esperando.slice(0, 6).forEach(function(m){
          var dias = diasEntre(hoje, m.proximo_followup);
          html += '<div class="atraso-linha">' +
            '<strong style="font-weight:400">' + esc(m.nome || "sem nome") + '</strong>' +
            (m.responsavel ? '<span style="color:var(--tinta-suave)">' + esc(m.responsavel) + '</span>' : "") +
            '<span class="atraso-dias">' + (dias === 0 ? "e hoje" : "ha " + dias + " dia" + (dias === 1 ? "" : "s")) + '</span>' +
            '<button class="btn btn-mini" data-abrir-marca="' + esc(m.id) + '" style="margin-left:auto">Abrir</button>' +
          '</div>';
        });
        html += '</div>';
      }

      html += '<div class="barra-acoes">' +
        '<div class="cresce"><input type="search" id="busca-marcas" placeholder="Buscar por nome, @ ou e-mail" value="' + esc(marcasBusca) + '"></div>' +
        '<select id="filtro-marcas" style="width:auto"><option value="todas">Todas as situacoes</option>' +
        SITUACOES.map(function(s){ return '<option value="' + s.valor + '"' + (marcasFiltro === s.valor ? " selected" : "") + '>' + s.texto + '</option>'; }).join("") +
        '</select>' +
        '<button class="btn" id="btn-csv-marcas">' + icone("baixar") + 'Baixar CSV</button>' +
        '<button class="btn" id="btn-importar-marcas">' + icone("subir") + 'Importar planilha</button>' +
        '<button class="btn btn-cheio" id="btn-nova-marca">' + icone("mais") + 'Adicionar marca</button>' +
      '</div>';

      if(todas.length === 0){
        html += blocoVazio("A sua base esta vazia. As marcas que mandarem mensagem pelo formulario do site chegam aqui sozinhas, como Lead.");
      } else if(lista.length === 0){
        html += blocoVazio("Nenhuma marca encontrada com esse filtro.");
      } else {
        html += '<div class="rolagem"><table><thead><tr>' +
          '<th>Marca</th><th>Instagram</th><th>E-mail</th><th>Situacao</th><th>Pode render</th><th>Voltar a falar</th><th>Ultimo contato</th><th style="text-align:right">Contato</th>' +
          '</tr></thead><tbody>';
        lista.forEach(function(m){
          var situacao = SITUACOES.filter(function(s){ return s.valor === m.situacao; })[0];
          var zap = String(m.telefone || "").replace(/\D/g, "");
          var insta = String(m.instagram || "").replace(/^@/, "");
          var f = String(m.proximo_followup || "").slice(0, 10);
          var atrasado = f && f <= hoje && m.situacao !== "cliente" && m.situacao !== "parada";
          html += '<tr class="clicavel" data-id="' + esc(m.id) + '">' +
            '<td>' + esc(m.nome || "sem nome") +
              (m.responsavel ? '<div class="lista-gancho">' + esc(m.responsavel) + '</div>' : "") + '</td>' +
            '<td>' + (insta ? '<a href="https://instagram.com/' + esc(insta) + '" target="_blank" rel="noopener" data-fora="1">@' + esc(insta) + '</a>' : "") + '</td>' +
            '<td>' + esc(m.email || "") + '</td>' +
            '<td><span class="pilula p-' + esc(m.situacao) + '">' + esc(situacao ? situacao.texto : m.situacao) + '</span></td>' +
            '<td>' + (Number(m.valor_potencial) > 0 ? esc(U.emReais(m.valor_potencial)) : "") + '</td>' +
            '<td>' + (f ? (atrasado
                ? '<span class="pilula etiqueta-erro">' + esc(U.paraBR(f)) + '</span>'
                : esc(U.paraBR(f))) : "") + '</td>' +
            '<td>' + esc(U.paraBR(m.ultimo_contato)) + '</td>' +
            '<td><div class="acoes-linha">' +
              (zap ? '<a class="icone-btn" href="https://wa.me/' + (zap.length <= 11 ? "55" + zap : zap) + '" target="_blank" rel="noopener" data-fora="1" title="Abrir WhatsApp">' + icone("zap") + '</a>' : "") +
            '</div></td></tr>';
        });
        html += '</tbody></table></div>';
      }

      painel.innerHTML = html;

      var campoBusca = document.getElementById("busca-marcas");
      campoBusca.addEventListener("input", function(){
        marcasBusca = campoBusca.value;
        var posicao = campoBusca.selectionStart;
        desenhar();
        var novo = document.getElementById("busca-marcas");
        novo.focus();
        novo.setSelectionRange(posicao, posicao);
      });

      document.getElementById("filtro-marcas").addEventListener("change", function(e){
        marcasFiltro = e.target.value;
        desenhar();
      });

      document.getElementById("btn-nova-marca").addEventListener("click", function(){
        abrirFormulario({
          titulo: "Nova marca",
          tabela: "marcas",
          campos: CAMPOS_MARCA,
          antesDeSalvar: function(d){ if(!d.nome) return "Escreva o nome da marca."; },
          depois: telaMarcas
        });
      });

      document.getElementById("btn-csv-marcas").addEventListener("click", function(){
        var lista2 = filtrar();
        if(lista2.length === 0){ falar("Nao ha nada para baixar.", true); return; }
        baixarCSV("minhas-marcas.csv",
          ["Marca","Responsavel","Instagram","E-mail","Telefone","Situacao","Pode render","Ultimo contato","Voltar a falar","Observacao"],
          lista2.map(function(m){
            var s = SITUACOES.filter(function(x){ return x.valor === m.situacao; })[0];
            return [m.nome, m.responsavel, m.instagram, m.email, m.telefone, (s ? s.texto : m.situacao),
                    String(Number(m.valor_potencial) || 0).replace(".", ","),
                    U.paraBR(m.ultimo_contato), U.paraBR(m.proximo_followup), m.obs];
          })
        );
        falar("Arquivo baixado.");
      });

      document.getElementById("btn-importar-marcas").addEventListener("click", function(){
        abrirImportarMarcas(todas, telaMarcas);
      });

      function abrirMarca(id){
        var m = todas.filter(function(x){ return String(x.id) === id; })[0];
        if(!m) return;
        abrirFormulario({
          titulo: "Editar marca",
          tabela: "marcas",
          campos: CAMPOS_MARCA,
          registro: m,
          antesDeSalvar: function(d){ if(!d.nome) return "Escreva o nome da marca."; },
          depois: telaMarcas
        });
      }

      Array.prototype.forEach.call(painel.querySelectorAll("tr[data-id]"), function(tr){
        tr.addEventListener("click", function(e){
          if(e.target.closest("[data-fora]")) return;
          abrirMarca(tr.getAttribute("data-id"));
        });

      Array.prototype.forEach.call(painel.querySelectorAll("[data-abrir-marca]"), function(b){
        b.addEventListener("click", function(){
          abrirMarca(b.getAttribute("data-abrir-marca"));
        });
      });
    }

    desenhar();
  }
