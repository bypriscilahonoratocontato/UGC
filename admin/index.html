<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Priscila Honorato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo: #5B3039;
    --superficie: #4B2730;
    --cartao: #542C35;
    --destaque: #EDCBD0;
    --detalhe: #DFB8C0;
    --tinta: #FFF8F2;
    --tinta-suave: #EADCDE;
    --linha: rgba(255, 248, 242, 0.22);
    --linha-forte: rgba(255, 248, 242, 0.4);
    --suave: rgba(237, 203, 208, 0.14);
    --erro: #F2B8B5;
    --alerta: #F5D98B;
    --ok: #B7DFC4;
    --corpo: "Montserrat", sans-serif;
    --menu: 232px;
  }

  *,*::before,*::after{ box-sizing: border-box; }

  html, body{ height:100%; }

  body{
    margin:0;
    background: var(--fundo);
    color: var(--tinta);
    font-family: var(--corpo);
    font-weight: 300;
    font-size: 0.86rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* a pagina so aparece depois de conferir a sessao */
  #app{ display:none; }
  #checando{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    color: var(--tinta-suave);
    font-size: 0.82rem;
  }

  h1,h2,h3,h4{ font-weight: 500; margin: 0; letter-spacing: 0.01em; }
  p{ margin: 0 0 0.8em; color: var(--tinta-suave); }
  a{ color: inherit; }

  button{ font-family: var(--corpo); cursor: pointer; }

  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--destaque);
    outline-offset: 2px;
  }

  /* ===================== ESTRUTURA ===================== */
  .layout{ display:flex; min-height:100vh; }

  .menu{
    width: var(--menu);
    flex-shrink:0;
    background: var(--superficie);
    border-right: 1px solid var(--linha);
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0; bottom:0; left:0;
    z-index: 60;
  }
  .menu-topo{
    padding: 1.3rem 1.1rem 1rem;
    border-bottom: 1px solid var(--linha);
  }
  .menu-nome{ font-size: 0.92rem; font-weight: 500; }
  .menu-sub{
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--destaque);
    margin-top: 0.15rem;
  }

  .menu-lista{ flex:1; overflow-y:auto; padding: 0.9rem 0.6rem; }
  .menu-grupo{
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    opacity: 0.65;
    padding: 0.9rem 0.5rem 0.45rem;
  }
  .menu-item{
    display:flex;
    align-items:center;
    gap: 0.65rem;
    width:100%;
    padding: 0.62em 0.6em;
    background: transparent;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--tinta-suave);
    font-size: 0.82rem;
    text-align:left;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .menu-item:hover{ background: rgba(255,248,242,0.06); color: var(--tinta); }
  .menu-item.ativo{
    background: var(--suave);
    color: var(--destaque);
    border-left-color: var(--destaque);
    font-weight: 500;
  }
  .menu-item svg{ width:17px; height:17px; flex-shrink:0; }

  .menu-rodape{
    padding: 0.9rem 1.1rem 1.1rem;
    border-top: 1px solid var(--linha);
  }
  .menu-email{
    font-size: 0.68rem;
    color: var(--tinta-suave);
    word-break: break-all;
    margin-bottom: 0.6rem;
  }
  .btn-sair{
    display:flex;
    align-items:center;
    gap:0.5rem;
    width:100%;
    padding: 0.55em 0.7em;
    background: transparent;
    border: 1px solid var(--linha);
    color: var(--tinta-suave);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .btn-sair:hover{ border-color: var(--destaque); color: var(--destaque); }
  .btn-sair svg{ width:15px; height:15px; }

  .conteudo{
    flex:1;
    margin-left: var(--menu);
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .topo{
    display:flex;
    align-items:center;
    gap: 0.9rem;
    padding: 1rem clamp(1rem, 3vw, 1.8rem);
    border-bottom: 1px solid var(--linha);
    position:sticky;
    top:0;
    background: var(--fundo);
    z-index: 40;
  }
  .topo h1{ font-size: 1rem; }
  .topo-sub{ font-size: 0.72rem; color: var(--tinta-suave); }
  .abre-menu{
    display:none;
    width:36px; height:36px;
    background:transparent;
    border:1px solid var(--linha);
    color: var(--tinta);
    align-items:center;
    justify-content:center;
  }
  .abre-menu svg{ width:17px; height:17px; }

  .painel{ padding: clamp(1rem, 3vw, 1.8rem); flex:1; }

  .fundo-escuro{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(20, 8, 12, 0.55);
    z-index: 55;
  }
  .fundo-escuro.aparece{ display:block; }

  @media (max-width: 860px){
    .menu{ transform: translateX(-100%); transition: transform 0.25s ease; }
    .menu.aberto{ transform: translateX(0); }
    .conteudo{ margin-left: 0; }
    .abre-menu{ display:flex; }
  }

  /* ===================== PECAS COMUNS ===================== */
  .aviso{
    border: 1px solid var(--alerta);
    color: var(--alerta);
    background: rgba(245, 217, 139, 0.08);
    padding: 0.7em 0.9em;
    font-size: 0.78rem;
    margin-bottom: 1rem;
  }
  .aviso + .aviso{ margin-top: -0.5rem; }

  .vazio{
    border: 1px dashed var(--linha);
    padding: 1.4rem;
    text-align:center;
    color: var(--tinta-suave);
    font-size: 0.8rem;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap: 0.45rem;
    padding: 0.55em 1.1em;
    background: transparent;
    border: 1px solid var(--linha-forte);
    color: var(--tinta);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .btn:hover{ border-color: var(--destaque); color: var(--destaque); }
  .btn-cheio{
    background: var(--destaque);
    border-color: var(--destaque);
    color: var(--superficie);
    font-weight: 500;
  }
  .btn-cheio:hover{ opacity: 0.88; color: var(--superficie); }
  .btn svg{ width:14px; height:14px; }
  .btn-mini{ padding: 0.35em 0.6em; font-size: 0.66rem; letter-spacing: 0.06em; }

  .barra-acoes{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
  .barra-acoes .cresce{ flex:1; min-width: 160px; }

  input[type="text"], input[type="email"], input[type="date"],
  input[type="number"], input[type="search"], select, textarea{
    width:100%;
    padding: 0.5em 0.7em;
    background: var(--superficie);
    border: 1px solid var(--linha);
    color: var(--tinta);
    font-family: var(--corpo);
    font-size: 0.82rem;
    font-weight: 300;
  }
  textarea{ min-height: 82px; resize: vertical; }
  select option{ background: var(--superficie); color: var(--tinta); }
  input::placeholder, textarea::placeholder{ color: var(--tinta-suave); opacity: 0.6; }

  /* faixa de numeros */
  .faixa-numeros{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
    border: 1px solid var(--linha);
    margin-bottom: 1.3rem;
  }
  .num-item{
    padding: 0.85rem 1rem;
    border-right: 1px solid var(--linha);
  }
  .num-item:last-child{ border-right: 0; }
  .num-valor{
    font-size: 1.35rem;
    font-weight: 500;
    color: var(--destaque);
    line-height: 1.2;
  }
  .num-rotulo{
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    margin-top: 0.15rem;
  }
  .num-extra{ font-size: 0.68rem; color: var(--tinta-suave); margin-top: 0.3rem; }
  @media (max-width: 700px){
    .num-item{ border-right:0; border-bottom: 1px solid var(--linha); }
  }

  /* tabelas */
  .rolagem{ overflow-x:auto; border: 1px solid var(--linha); }
  table{ width:100%; border-collapse: collapse; font-size: 0.8rem; }
  thead th{
    text-align:left;
    padding: 0.6em 0.75em;
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    border-bottom: 1px solid var(--linha);
    white-space: nowrap;
    background: var(--superficie);
  }
  tbody td{
    padding: 0.6em 0.75em;
    border-bottom: 1px solid var(--linha);
    vertical-align: middle;
  }
  tbody tr:last-child td{ border-bottom: 0; }
  tbody tr.clicavel:hover{ background: rgba(255,248,242,0.05); }

  th.ordenavel{ cursor: pointer; user-select:none; }
  th.ordenavel:hover{ color: var(--destaque); }
  th .seta{ opacity: 0.3; margin-left: 0.3rem; font-size: 0.7rem; }
  th.ordenando .seta{ opacity: 1; color: var(--destaque); }

  .acoes-linha{ display:flex; gap:0.3rem; justify-content:flex-end; }
  .icone-btn{
    width:26px; height:26px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:1px solid var(--linha);
    color: var(--tinta-suave);
  }
  .icone-btn:hover{ border-color: var(--destaque); color: var(--destaque); }
  .icone-btn svg{ width:13px; height:13px; }
  .icone-btn.apagado{ opacity: 0.45; }

  .alca{ cursor: grab; color: var(--tinta-suave); }
  .alca:active{ cursor: grabbing; }
  tr.arrastando{ opacity: 0.4; }
  tr.alvo td{ border-top: 2px solid var(--destaque); }

  /* pilulas */
  .pilula{
    display:inline-block;
    padding: 0.2em 0.6em;
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    border: 1px solid currentColor;
    white-space: nowrap;
  }
  .p-lead{ color: #F5D98B; }
  .p-conversando{ color: #9FD0E8; }
  .p-cliente{ color: #B7DFC4; }
  .p-parada{ color: #D9C3C7; }
  .p-conteudo{ color: var(--destaque); }
  .p-publicidade{ color: #C9B6E8; }
  .p-status{ color: var(--detalhe); }
  .etiqueta-erro{ color: var(--erro); border-color: var(--erro); }
  .etiqueta-alerta{ color: var(--alerta); border-color: var(--alerta); }

  tr.favorita{ box-shadow: inset 3px 0 0 var(--destaque); }
  .estrela{ background:none; border:0; color: var(--linha-forte); font-size: 0.95rem; line-height:1; padding:0; }
  .estrela.on{ color: var(--alerta); }

  /* grafico */
  .grafico{
    display:flex;
    align-items:flex-end;
    gap: 4px;
    height: 132px;
    padding: 0.8rem;
    border: 1px solid var(--linha);
  }
  .barra-col{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; gap:5px; }
  .barra{ width:100%; background: var(--destaque); opacity: 0.85; min-height: 2px; }
  .barra-col:hover .barra{ opacity: 1; }
  .barra-dia{ font-size: 0.58rem; color: var(--tinta-suave); white-space:nowrap; }

  .duas-colunas{
    display:grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 1.1rem;
    margin-bottom: 1.4rem;
  }
  @media (max-width: 860px){ .duas-colunas{ grid-template-columns: 1fr; } }

  .bloco{ border: 1px solid var(--linha); padding: 0.9rem 1rem; }
  .bloco-titulo{
    font-size: 0.64rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    margin-bottom: 0.7rem;
  }
  .lista-origem{ display:flex; flex-direction:column; gap: 0.45rem; }
  .origem-linha{ display:flex; justify-content:space-between; gap:0.6rem; font-size: 0.78rem; }
  .origem-linha span:last-child{ color: var(--destaque); }

  /* calendario */
  .cal-topo{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: 0.6rem;
    margin-bottom: 0.9rem;
  }
  .cal-mes{ font-size: 0.92rem; font-weight: 500; min-width: 165px; text-transform: capitalize; }
  .cal-grade{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    border: 1px solid var(--linha);
    border-right: 0;
    border-bottom: 0;
  }
  .cal-cabecalho{
    padding: 0.45em;
    text-align:center;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    background: var(--superficie);
    border-right: 1px solid var(--linha);
    border-bottom: 1px solid var(--linha);
  }
  .cal-dia{
    position:relative;
    min-height: 92px;
    padding: 0.35rem;
    border-right: 1px solid var(--linha);
    border-bottom: 1px solid var(--linha);
    cursor: pointer;
  }
  .cal-dia:hover{ background: rgba(255,248,242,0.04); }
  .cal-dia.fora{ opacity: 0.35; }
  .cal-dia.hoje{ background: var(--suave); }
  .cal-dia.hoje .cal-numero{ color: var(--destaque); font-weight: 600; }
  .cal-numero{ font-size: 0.7rem; color: var(--tinta-suave); margin-bottom: 0.25rem; }
  .cal-mais-btn{
    position:absolute;
    top: 0.25rem; right: 0.25rem;
    width:18px; height:18px;
    display:none;
    align-items:center;
    justify-content:center;
    background: var(--destaque);
    border:0;
    color: var(--superficie);
    font-size: 0.8rem;
    line-height:1;
  }
  .cal-dia:hover .cal-mais-btn{ display:flex; }
  .cal-item{
    display:block;
    width:100%;
    text-align:left;
    background: rgba(255,248,242,0.07);
    border:0;
    border-left: 2px solid var(--detalhe);
    color: var(--tinta);
    font-size: 0.64rem;
    padding: 0.18em 0.3em;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .cal-item.gravar{ border-left-color: #F5D98B; }
  .cal-item.editar{ border-left-color: #9FD0E8; }
  .cal-item.postar{ border-left-color: #B7DFC4; }
  .cal-item.prazo{ border-left-color: var(--erro); font-style: italic; }
  .cal-item.feito{ opacity: 0.5; text-decoration: line-through; }
  .cal-mais{ font-size: 0.6rem; color: var(--destaque); background:none; border:0; padding: 0.1em 0.3em; }
  @media (max-width: 700px){
    .cal-dia{ min-height: 66px; }
    .cal-item{ font-size: 0.55rem; }
  }

  .atrasados{ margin-top: 1.4rem; }
  .atraso-linha{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: 0.6rem;
    padding: 0.5em 0;
    border-bottom: 1px solid var(--linha);
    font-size: 0.8rem;
  }
  .atraso-linha:last-child{ border-bottom:0; }
  .atraso-dias{ color: var(--erro); font-size: 0.7rem; }

  /* sub abas */
  .sub-abas{
    display:flex;
    flex-wrap:wrap;
    gap: 0.4rem;
    border-bottom: 1px solid var(--linha);
    margin-bottom: 1.2rem;
  }
  .sub-aba{
    padding: 0.5em 0.9em;
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--tinta-suave);
    font-size: 0.76rem;
  }
  .sub-aba:hover{ color: var(--tinta); }
  .sub-aba.ativo{ color: var(--destaque); border-bottom-color: var(--destaque); }

  /* checklist */
  .progresso-geral{
    display:flex;
    align-items:center;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
    font-size: 0.78rem;
  }
  .barra-fundo{ flex:1; height: 5px; background: rgba(255,248,242,0.12); }
  .barra-cheia{ height:100%; background: var(--destaque); width:0%; transition: width 0.3s ease; }

  .secao{ border: 1px solid var(--linha); margin-bottom: 0.7rem; }
  .secao-cabecalho{
    display:flex;
    align-items:center;
    gap: 0.7rem;
    width:100%;
    padding: 0.75em 0.9em;
    background: transparent;
    border:0;
    color: var(--tinta);
    text-align:left;
  }
  .secao-cabecalho:hover{ background: rgba(255,248,242,0.04); }
  .secao-emoji{ font-size: 1rem; }
  .secao-nome{ font-weight: 500; font-size: 0.86rem; }
  .secao-resumo{ font-size: 0.72rem; color: var(--tinta-suave); }
  .secao-conta{ font-size: 0.7rem; color: var(--destaque); white-space:nowrap; }
  .secao-corpo{ display:none; padding: 0 0.9em 0.9em; }
  .secao.aberta .secao-corpo{ display:block; }
  .secao-porque{
    font-size: 0.78rem;
    color: var(--tinta-suave);
    border-left: 2px solid var(--detalhe);
    padding-left: 0.7rem;
    margin-bottom: 0.9rem;
  }
  .item-check{ display:flex; gap: 0.6rem; padding: 0.5em 0; border-top: 1px solid var(--linha); }
  .item-check input{ width:15px; height:15px; margin-top: 0.2rem; flex-shrink:0; accent-color: #EDCBD0; }
  .item-t{ font-size: 0.82rem; }
  .item-t.feito{ opacity: 0.55; text-decoration: line-through; }
  .item-d{ font-size: 0.72rem; color: var(--tinta-suave); }

  /* referencias */
  .grade-cartoes{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 0.9rem;
  }
  .cartao-ref{
    border: 1px solid var(--linha);
    background: transparent;
    padding: 0;
    text-align:left;
    color: var(--tinta);
    overflow:hidden;
  }
  .cartao-ref:hover{ border-color: var(--destaque); }
  .ref-capa{
    aspect-ratio: 9 / 16;
    background: linear-gradient(155deg, #784550 0%, var(--fundo) 55%, var(--superficie) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 2rem;
  }
  .ref-corpo{ padding: 0.6rem 0.7rem 0.8rem; }
  .ref-titulo{ font-size: 0.8rem; font-weight: 500; margin-bottom: 0.25rem; }
  .ref-meta{ font-size: 0.66rem; color: var(--tinta-suave); }

  .bloco-tempo{ display:flex; gap: 0.8rem; padding: 0.55em 0; border-top: 1px solid var(--linha); }
  .bloco-t{
    font-size: 0.66rem;
    color: var(--destaque);
    white-space:nowrap;
    min-width: 62px;
    padding-top: 0.15rem;
  }
  .bloco-o{ font-size: 0.8rem; }
  .bloco-o b{ font-weight: 500; }
  .bloco-o em{ color: var(--tinta-suave); }

  .lista-ideia{ padding: 0.45em 0; border-top: 1px solid var(--linha); font-size: 0.82rem; }
  .lista-gancho{ font-size: 0.75rem; color: var(--tinta-suave); font-style: italic; }

  /* modal */
  .modal-fundo{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(20, 8, 12, 0.65);
    z-index: 80;
    padding: 1.2rem;
    overflow-y:auto;
  }
  .modal-fundo.aberto{ display:flex; align-items:flex-start; justify-content:center; }
  .modal{
    background: var(--superficie);
    border: 1px solid var(--linha-forte);
    width:100%;
    max-width: 470px;
    margin: auto;
    padding: 1.3rem;
  }
  .modal-largo{ max-width: 660px; }
  .modal-topo{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .modal-titulo{ font-size: 0.95rem; font-weight: 500; }
  .modal-fechar{
    width:26px; height:26px;
    background:transparent;
    border:1px solid var(--linha);
    color: var(--tinta);
    font-size: 0.9rem;
    line-height:1;
    flex-shrink:0;
  }
  .modal-campo{ margin-bottom: 0.8rem; }
  .modal-campo label{
    display:block;
    font-size: 0.64rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--tinta-suave);
    margin-bottom: 0.35rem;
  }
  .modal-linha-check{ display:flex; align-items:center; gap: 0.5rem; }
  .modal-linha-check input{ width:15px; height:15px; accent-color: #EDCBD0; }
  .modal-linha-check label{ margin:0; text-transform:none; letter-spacing:0; font-size: 0.8rem; color: var(--tinta); }
  .modal-botoes{ display:flex; gap: 0.6rem; justify-content:flex-end; margin-top: 1.1rem; }
  .btn-perigo{ border-color: var(--erro); color: var(--erro); margin-right:auto; }
  .btn-perigo:hover{ background: var(--erro); color: var(--superficie); }

  .recado{
    position:fixed;
    bottom: 1.1rem;
    left: 50%;
    transform: translateX(-50%) translateY(1rem);
    background: var(--destaque);
    color: var(--superficie);
    padding: 0.6em 1.2em;
    font-size: 0.78rem;
    font-weight: 500;
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 95;
    max-width: 90vw;
    text-align:center;
  }
  .recado.aparece{ opacity:1; transform: translateX(-50%) translateY(0); }
  .recado.ruim{ background: var(--erro); }

  .escondido{ display:none !important; }
.ref-capa{aspect-ratio:9/16;height:auto;min-height:180px} .modal:focus{outline:none} @media(hover:none){.cal-mais-btn{opacity:1}}

<body>

<div id="app">
  <div class="layout">

    <aside class="menu" id="menu">

        <button class="btn-sair" id="btn-sair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script src="../js/biblioteca.js"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     PARTE 1: PORTA DE ENTRADA
     Antes de qualquer coisa, confere se ha sessao aberta.
     Sem sessao, manda para o login e nem mostra a pagina.
     ============================================================ */
  var U = window.BancoUtil;
  var sessaoAtual = null;

  (async function porta(){
    if(!window.sb){
      document.getElementById("checando").textContent =
        "Nao consegui carregar a conexao com o banco. Recarregue a pagina.";
      return;
    }
    sessaoAtual = await U.sessao();
    if(!sessaoAtual || sessaoAtual.user.email !== window.BANCO.emailDona){
      window.location.replace("../login/");
      return;
    }
    /* Segunda conferencia: mesmo logada, so a dona entra. */
    var emailEntrou = (sessaoAtual.user && sessaoAtual.user.email) || "";
    if(emailEntrou !== window.BANCO.emailDona){
      try { await U.sair(); } catch(err){ /* segue para o login assim mesmo */ }
      window.location.replace("../login/");
      return;
    }
    document.getElementById("checando").style.display = "none";
    document.getElementById("app").style.display = "block";
    window.sb.auth.onAuthStateChange(function(event,session){if(!session){document.getElementById("app").style.display="none";window.location.replace("../login/");}});
    iniciar();
  })();

  /* ============================================================
     PARTE 2: FERRAMENTAS DE TELA
     ============================================================ */
  var painel      = document.getElementById("painel");
  var tituloAba   = document.getElementById("titulo-aba");
  var subAba      = document.getElementById("sub-aba");
  var modalFundo  = document.getElementById("modal-fundo");
  var modalCaixa  = document.getElementById("modal");
  var modalTitulo = document.getElementById("modal-titulo");
  var modalCorpo  = document.getElementById("modal-corpo");
  var recado      = document.getElementById("recado");
  var menu        = document.getElementById("menu");
  var fundoEscuro = document.getElementById("fundo-escuro");

  var esc = U.escapar;
  var recadoTempo = null;

  function falar(texto, ruim){
    recado.textContent = texto;
    recado.className = "recado aparece" + (ruim ? " ruim" : "");
    if(recadoTempo) clearTimeout(recadoTempo);
    recadoTempo = setTimeout(function(){ recado.className = "recado" + (ruim ? " ruim" : ""); }, 3200);
  }

  function abrirModal(titulo, html, largo){
    modalTitulo.textContent = titulo;
    modalCorpo.innerHTML = html;
    modalCaixa.className = "modal" + (largo ? " modal-largo" : "");
    modalFundo.classList.add("aberto");
  }
  function fecharModal(){
    modalFundo.classList.remove("aberto");
    modalCorpo.innerHTML = "";
  }
  document.getElementById("modal-fechar").addEventListener("click", fecharModal);
  modalFundo.addEventListener("click", function(e){ if(e.target === modalFundo) fecharModal(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && modalFundo.classList.contains("aberto")) fecharModal();
  });

  function icone(nome){
    var caminhos = {
      portfolio: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
      marcas:    '<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M10 21v-6h4v6"/>',
      calendario:'<rect x="3" y="4" width="18" height="18" rx="1"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
      campanhas: '<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M18 8a5 5 0 0 1 0 8"/>',
      checklist: '<polyline points="9 11 12 14 20 6"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h10"/>',
      ideias:    '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a6 6 0 0 0-4 10.5c.6.7 1 1.5 1 2.5h6c0-1 .4-1.8 1-2.5A6 6 0 0 0 12 2z"/>',
      mais:      '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      lapis:     '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
      lixo:      '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
      olho:      '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
      olhoOff:   '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>',
      baixar:    '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
      zap:       '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 20.5l1.6-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>',
      link:      '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
      arrasta:   '<circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/>',
      esquerda:  '<polyline points="15 18 9 12 15 6"/>',
      direita:   '<polyline points="9 18 15 12 9 6"/>'
    };
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
           (caminhos[nome] || "") + '</svg>';
  }

  function blocoAviso(texto){
    return texto ? '<div class="aviso">' + esc(texto) + '</div>' : "";
  }
  function blocoVazio(texto){
    return '<div class="vazio">' + esc(texto) + '</div>';
  }

  /* Formulario generico usado por videos, marcas, calendario, campanhas e ideias */
  function montarFormulario(campos, valores){
    valores = valores || {};
    var html = '<form id="form-modal">';
    campos.forEach(function(c){
      var v = valores[c.nome];
      if(v === null || v === undefined) v = (c.padrao !== undefined ? c.padrao : "");
      if(c.tipo === "checkbox"){
        html += '<div class="modal-campo"><div class="modal-linha-check">' +
                '<input type="checkbox" id="f-' + c.nome + '" name="' + c.nome + '"' + (v ? " checked" : "") + '>' +
                '<label for="f-' + c.nome + '">' + esc(c.rotulo) + '</label></div></div>';
      } else if(c.tipo === "select"){
        html += '<div class="modal-campo"><label for="f-' + c.nome + '">' + esc(c.rotulo) + '</label>' +
                '<select id="f-' + c.nome + '" name="' + c.nome + '">';
        c.opcoes.forEach(function(op){
          var valor = (typeof op === "object") ? op.valor : op;
          var texto = (typeof op === "object") ? op.texto : op;
          html += '<option value="' + esc(valor) + '"' + (String(v) === String(valor) ? " selected" : "") + '>' + esc(texto) + '</option>';
        });
        html += '</select></div>';
      } else if(c.tipo === "textarea"){
        html += '<div class="modal-campo"><label for="f-' + c.nome + '">' + esc(c.rotulo) + '</label>' +
                '<textarea id="f-' + c.nome + '" name="' + c.nome + '">' + esc(v) + '</textarea></div>';
      } else {
        html += '<div class="modal-campo"><label for="f-' + c.nome + '">' + esc(c.rotulo) + '</label>' +
                '<input type="' + (c.tipo || "text") + '" id="f-' + c.nome + '" name="' + c.nome + '" value="' + esc(v) + '"' +
                (c.passo ? ' step="' + c.passo + '"' : "") + '></div>';
      }
    });
    html += '</form>';
    return html;
  }

  function lerFormulario(campos){
    var form = document.getElementById("form-modal");
    var dados = {};
    campos.forEach(function(c){
      var el = form.elements[c.nome];
      if(!el) return;
      if(c.tipo === "checkbox") dados[c.nome] = el.checked;
      else if(c.tipo === "number") dados[c.nome] = el.value === "" ? 0 : Number(el.value);
      else if(c.tipo === "date") dados[c.nome] = el.value || null;
      else dados[c.nome] = el.value.trim();
    });
    return dados;
  }

  /* Abre o formulario de uma tabela qualquer e salva no banco */
  function abrirFormulario(opcoes){
    var campos = opcoes.campos;
    var registro = opcoes.registro || null;
    var html = montarFormulario(campos, registro) +
      '<div class="modal-botoes">' +
        (registro && registro.id ? '<button type="button" class="btn btn-mini btn-perigo" id="btn-apagar">Apagar</button>' : "") +
        '<button type="button" class="btn" id="btn-cancelar">Cancelar</button>' +
        '<button type="button" class="btn btn-cheio" id="btn-salvar">Salvar</button>' +
      '</div>';

    abrirModal(opcoes.titulo, html);

    document.getElementById("btn-cancelar").addEventListener("click", fecharModal);

    document.getElementById("btn-salvar").addEventListener("click", async function(){
      if(this.disabled)return;
      if(!document.getElementById("form-modal").reportValidity())return;
      var dados = lerFormulario(campos);
      if(opcoes.tabela==="videos" && dados.link && !U.urlSegura(dados.link)){falar("Use um link começando por https://",true);return;}
      if(opcoes.tabela==="campanhas" && (!Number.isInteger(dados.qtd)||dados.qtd<1||dados.valor<0)){falar("A quantidade deve ser inteira e maior que zero. O valor não pode ser negativo.",true);return;}
      if(opcoes.antesDeSalvar){
        var problema = opcoes.antesDeSalvar(dados);
        if(problema){ falar(problema, true); return; }
      }
      this.disabled=true;
      var r;
      if(registro && registro.id){
        r = await U.gravar(opcoes.tabela, function(q){ return q.update(dados).eq("id", registro.id); });
      } else {
        r = await U.gravar(opcoes.tabela, function(q){ return q.insert(dados); });
      }
      if(!r.ok){ this.disabled=false; falar(r.erro, true); return; }
      fecharModal();
      falar("Salvo.");
      if(opcoes.depois) opcoes.depois();
    });

    if(registro && registro.id){
      document.getElementById("btn-apagar").addEventListener("click", async function(){
        if(!window.confirm("Apagar de vez? Isso nao volta.")) return;
        var r = await U.gravar(opcoes.tabela, function(q){ return q.delete().eq("id", registro.id); });
        if(!r.ok){ falar(r.erro, true); return; }
        fecharModal();
        falar("Apagado.");
        if(opcoes.depois) opcoes.depois();
      });
    }
  }

  /* Baixar CSV que abre certo no Excel, com acento */
  function baixarCSV(nomeArquivo, cabecalhos, linhas){
    var sep = ";";
    var texto = cabecalhos.join(sep) + "\r\n";
    linhas.forEach(function(linha){
      texto += linha.map(function(celula){
        var t = String(celula === null || celula === undefined ? "" : celula).replace(/"/g, '""');
        if(/^[=+@\-\t\r]/.test(t))t="'"+t;
        return '"' + t + '"';
      }).join(sep) + "\r\n";
    });
    var blob = new Blob(["﻿" + texto], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }

  function hojeISO(){ return U.paraISO(new Date()); }

  function diasEntre(isoA, isoB){
    var a = new Date(String(isoA).slice(0,10) + "T00:00:00");
    var b = new Date(String(isoB).slice(0,10) + "T00:00:00");
    if(isNaN(a.getTime()) || isNaN(b.getTime())) return null;
    return Math.round((a - b) / 86400000);
  }

  /* ============================================================
     PARTE 3: MENU
     ============================================================ */
  var ABAS = [
    { id: "portfolio",  nome: "Portfolio",  grupo: "meu site",     icone: "portfolio",  sub: "Como o seu site esta indo" },
    { id: "marcas",     nome: "Marcas",     grupo: "meu site",     icone: "marcas",     sub: "A sua base de contatos" },
    { id: "calendario", nome: "Calendario", grupo: "minha rotina", icone: "calendario", sub: "O mes inteiro de producao" },
    { id: "campanhas",  nome: "Campanhas",  grupo: "minha rotina", icone: "campanhas",  sub: "Trabalhos, valores e prazos" },
    { id: "checklist",  nome: "Checklist",  grupo: "minha rotina", icone: "checklist",  sub: "O que falta no seu portfolio" },
    { id: "ideias",     nome: "Ideias",     grupo: "minha rotina", icone: "ideias",     sub: "Suas ideias de conteudo" }
  ];

  var abaAtual = "portfolio";

  function montarMenu(){
    var lista = document.getElementById("menu-lista");
    var html = "";
    var grupoAnterior = null;
    ABAS.forEach(function(aba){
      if(aba.grupo !== grupoAnterior){
        html += '<div class="menu-grupo">' + esc(aba.grupo) + '</div>';
        grupoAnterior = aba.grupo;
      }
      html += '<button class="menu-item" data-aba="' + aba.id + '">' + icone(aba.icone) + esc(aba.nome) + '</button>';
    });
    lista.innerHTML = html;
    Array.prototype.forEach.call(lista.querySelectorAll(".menu-item"), function(btn){
      btn.addEventListener("click", function(){
        irPara(btn.getAttribute("data-aba"));
        fecharGaveta();
      });
    });
  }

  function marcarAtivo(){
    Array.prototype.forEach.call(document.querySelectorAll(".menu-item"), function(btn){
      btn.classList.toggle("ativo", btn.getAttribute("data-aba") === abaAtual);
    });
    var aba = ABAS.filter(function(a){ return a.id === abaAtual; })[0];
    if(aba){
      tituloAba.textContent = aba.nome;
      subAba.textContent = aba.sub;
      document.title = aba.nome + " | Painel";
    }
  }

  function abrirGaveta(){ menu.classList.add("aberto"); fundoEscuro.classList.add("aparece"); }
  function fecharGaveta(){ menu.classList.remove("aberto"); fundoEscuro.classList.remove("aparece"); }
  document.getElementById("abre-menu").addEventListener("click", abrirGaveta);
  fundoEscuro.addEventListener("click", fecharGaveta);

  function irPara(id){
    abaAtual = id;
    marcarAtivo();
    painel.innerHTML = '<div class="vazio">Carregando...</div>';
    var telas={portfolio:telaPortfolio,marcas:telaMarcas,calendario:telaCalendario,campanhas:telaCampanhas,checklist:telaChecklist,ideias:telaIdeias};
    Promise.resolve().then(function(){return telas[id]();}).catch(function(){
      if(abaAtual===id)painel.innerHTML=blocoAviso('Não foi possível abrir esta aba. Confira a conexão e a estrutura do banco. As outras abas continuam disponíveis.');
    });
  }

  /* ============================================================
     PARTE 4: ABA PORTFOLIO
     ============================================================ */
  /* As marcas dos produtos que voce usa nos conteudos autorais.
     Para incluir uma marca nova, basta acrescentar aqui. */
  var MARCAS_PRODUTO = [
    "Tokstok", "Camicado", "Brastemp", "Brinox", "L'envie",
    "Petiko", "Meli+", "Flo", "Matos e Lopes", "Rituália", "Fórmula Natural Life"
  ];

  var CAMPOS_VIDEO = [
    { nome: "tipo_midia", rotulo: "Isto e uma foto ou um video?", tipo: "select", opcoes: [
        { valor: "foto",  texto: "Foto" },
        { valor: "video", texto: "Video" }
      ], padrao: "foto" },
    { nome: "titulo",    rotulo: "Titulo", tipo: "text" },
    { nome: "descricao", rotulo: "Legenda (ex: Fotografia e composicao com um produto da minha rotina)", tipo: "textarea" },
    { nome: "marca",     rotulo: "Marca do produto", tipo: "select",
      opcoes: [{ valor: "", texto: "Sem marca" }].concat(MARCAS_PRODUTO.map(function(m){
        return { valor: m, texto: m };
      })), padrao: "" },
    { nome: "imagem",    rotulo: "Imagem (nome do arquivo na pasta fotos, ou link completo)", tipo: "text" },
    { nome: "link",      rotulo: "Link do video (deixe vazio para foto)", tipo: "text" },
    { nome: "nicho",     rotulo: "Nicho", tipo: "select", opcoes: [
        { valor: "casa", texto: "Casa e decoracao" },
        { valor: "pet",  texto: "Pet" },
        { valor: "tech", texto: "Tech" }
      ], padrao: "casa" },
    { nome: "formato",   rotulo: "Formato", tipo: "text", padrao: "foto 4:5" },
    { nome: "ordem",     rotulo: "Ordem na pagina", tipo: "number", padrao: 0 },
    { nome: "visivel",   rotulo: "Aparecer no site", tipo: "checkbox", padrao: true }
  ];

  async function telaPortfolio(){
    var rv = await U.ler("videos", function(q){ return q.order("ordem", { ascending: true }); });
    var inicioVisitas=new Date();inicioVisitas.setDate(inicioVisitas.getDate()-13);inicioVisitas.setHours(0,0,0,0);
    var rvis = await U.ler("visitas", function(q){ return q.gte("data",inicioVisitas.toISOString()).order("data", { ascending: false }); });

    if(abaAtual!=="portfolio")return;
    var videos = rv.dados;
    var visitas = rvis.dados;

    /* contas seguras, nunca dividem por zero */
    var hoje = hojeISO();
    var dias = [];
    for(var i = 13; i >= 0; i--){
      var d = new Date();
      d.setDate(d.getDate() - i);
      dias.push(U.paraISO(d));
    }
    var porDia = {};
    dias.forEach(function(d){ porDia[d] = 0; });

    var origens = {};
    var visitas14 = 0, visitasHoje = 0;
    visitas.forEach(function(v){
      var d = U.paraISO(v.data);
      if(porDia.hasOwnProperty(d)){ porDia[d]++; visitas14++; }
      if(d === hoje) visitasHoje++;
      var o = (v.origem || "").trim() || "direto";
      origens[o] = (origens[o] || 0) + 1;
    });

    var noAr = videos.filter(function(v){ return v.visivel; }).length;

    var porNicho = {};
    videos.filter(function(v){return v.visivel && !/^EXEMPLO/i.test(v.titulo||"");}).forEach(function(v){

  /* arrastar para reordenar */
  function ligarArrastar(videos){
    var corpo = document.getElementById("corpo-videos");
    if(!corpo) return;
    var arrastando = null;

    Array.prototype.forEach.call(corpo.querySelectorAll("tr"), function(tr){
      tr.addEventListener("dragstart", function(){
        arrastando = tr;
        tr.classList.add("arrastando");
      });
      tr.addEventListener("dragend", async function(){
        tr.classList.remove("arrastando");
        Array.prototype.forEach.call(corpo.querySelectorAll("tr"), function(x){ x.classList.remove("alvo"); });
        if(!arrastando) return;
        arrastando = null;
        var ids = Array.prototype.map.call(corpo.querySelectorAll("tr"), function(x){ return x.getAttribute("data-id"); });
        var erro = null;
        for(var i = 0; i < ids.length; i++){
          var r = await U.gravar("videos", function(q){ return q.update({ ordem: i + 1 }).eq("id", ids[i]); });
          if(!r.ok) erro = r.erro;
        }
        if(erro) falar(erro, true);
        else falar("Nova ordem salva.");
        telaPortfolio();
      });
      tr.addEventListener("dragover", function(e){
        e.preventDefault();
        if(!arrastando || arrastando === tr) return;
        Array.prototype.forEach.call(corpo.querySelectorAll("tr"), function(x){ x.classList.remove("alvo"); });
        tr.classList.add("alvo");
        var caixa = tr.getBoundingClientRect();
        var meio = caixa.top + caixa.height / 2;
        if(e.clientY < meio) corpo.insertBefore(arrastando, tr);
        else corpo.insertBefore(arrastando, tr.nextSibling);
      });
    });
  }

          '<th>Marca</th><th>Instagram</th><th>E-mail</th><th>Telefone</th><th>Situacao</th><th>Observacao</th><th>Ultimo contato</th><th style="text-align:right">Contato</th>' +
          '</tr></thead><tbody>';
        lista.forEach(function(m){

            '<td>' + esc(m.email || "") + '</td>' +
            '<td>' + esc(m.telefone || "") + '</td>' +
            '<td><span class="pilula p-' + esc(m.situacao) + '">' + esc(situacao ? situacao.texto : m.situacao) + '</span></td>' +
            '<td>' + esc(String(m.obs || "").slice(0, 44)) + (String(m.obs || "").length > 44 ? "..." : "") + '</td>' +
            '<td>' + esc(U.paraBR(m.ultimo_contato)) + '</td>' +

        novo.focus();
        novo.setSelectionRange(posicao, posicao);

          antesDeSalvar: function(d){ if(!d.nome) return "Escreva o nome da marca."; },

  /* ============================================================

     ============================================================ */
  var TIPOS_CAL = [
    { valor: "gravar", texto: "Gravar" },
    { valor: "editar", texto: "Editar" },
    { valor: "postar", texto: "Postar" }
  ];
  var CAMPOS_CAL = [
    { nome: "titulo", rotulo: "O que e",   tipo: "text" },
    { nome: "marca",  rotulo: "Marca",     tipo: "text" },
    { nome: "tipo",   rotulo: "Tipo",      tipo: "select", opcoes: TIPOS_CAL, padrao: "gravar" },
    { nome: "data",   rotulo: "Data",      tipo: "date" },
    { nome: "status", rotulo: "Situacao",  tipo: "select", opcoes: [
        { valor: "a fazer", texto: "A fazer" },
        { valor: "feito",   texto: "Feito" }
      ], padrao: "a fazer" }
  ];

  var mesVisivel = (function(){ var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
  var filtroTipoCal = "todos";

  async function telaCalendario(){
    var rc = await U.ler("calendario", null);
    var rp = await U.ler("campanhas", function(q){ return q.not("prazo", "is", null); });

    if(abaAtual!=="calendario")return;
    var itens = rc.dados;
    var campanhas = rp.dados;

    /* prazos de campanha entram como itens que nao se edita aqui */
    var prazos = campanhas.map(function(c){
      return {
        id: "prazo-" + c.id,
        titulo: "Prazo: " + (c.campanha || "campanha"),
        marca: c.cliente || "",
        tipo: "prazo",
        data: c.prazo,
        status: (c.status === "Entregue") ? "feito" : "a fazer",
        ehPrazo: true
      };
    });

    function todosDoDia(iso){
      var lista = itens.concat(prazos).filter(function(i){ return String(i.data || "").slice(0,10) === iso; });
      if(filtroTipoCal !== "todos") lista = lista.filter(function(i){ return i.tipo === filtroTipoCal; });
      return lista;
    }

    function desenhar(){
      var ano = mesVisivel.getFullYear();
      var mes = mesVisivel.getMonth();
      var primeiro = new Date(ano, mes, 1);
      var deslocamento = (primeiro.getDay() + 6) % 7;
      var inicio = new Date(ano, mes, 1 - deslocamento);
      var hoje = hojeISO();

      var nomeMes = primeiro.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

      var html = "";
      html += blocoAviso(rc.erro);
      html += blocoAviso(rp.erro);

      html += '<div class="cal-topo">' +
        '<button class="icone-btn" id="mes-antes" title="Mes anterior">' + icone("esquerda") + '</button>' +
        '<button class="icone-btn" id="mes-depois" title="Proximo mes">' + icone("direita") + '</button>' +
        '<div class="cal-mes">' + esc(nomeMes) + '</div>' +
        '<button class="btn btn-mini" id="mes-hoje">Este mes</button>' +
        '<select id="filtro-cal" style="width:auto;margin-left:auto">' +
          '<option value="todos">Todos os tipos</option>' +
          TIPOS_CAL.map(function(t){ return '<option value="' + t.valor + '"' + (filtroTipoCal === t.valor ? " selected" : "") + '>' + t.texto + '</option>'; }).join("") +
        '</select>' +
        '<button class="btn btn-cheio" id="btn-novo-cal">' + icone("mais") + 'Adicionar</button>' +
      '</div>';

      html += '<div class="cal-grade">';
      ["Seg","Ter","Qua","Qui","Sex","Sab","Dom"].forEach(function(d){
        html += '<div class="cal-cabecalho">' + d + '</div>';
      });

      for(var c = 0; c < 42; c++){
        var dia = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + c);
        var iso = U.paraISO(dia);
        var fora = dia.getMonth() !== mes;
        var ehHoje = (iso === hoje);
        var doDia = todosDoDia(iso);

        html += '<div class="cal-dia' + (fora ? " fora" : "") + (ehHoje ? " hoje" : "") + '" data-dia="' + iso + '">' +
                '<button class="cal-mais-btn" data-add="' + iso + '" title="Adicionar neste dia">+</button>' +
                '<div class="cal-numero">' + dia.getDate() + '</div>';

        doDia.slice(0, 3).forEach(function(i){
          html += '<button class="cal-item ' + esc(i.tipo) + (i.status === "feito" ? " feito" : "") + '"' +
                  (i.ehPrazo ? "" : ' data-item="' + esc(i.id) + '"') +
                  ' title="' + esc(i.titulo) + '">' + esc(i.titulo) + '</button>';
        });
        if(doDia.length > 3){
          html += '<button class="cal-mais" data-dia-todos="' + iso + '">mais ' + (doDia.length - 3) + '</button>';
        }
        html += '</div>';
      }
      html += '</div>';

      /* ficou pra tras */
      var atrasados = itens.filter(function(i){
        var d = String(i.data || "").slice(0,10);
        return i.status === "a fazer" && d && d < hoje;
      }).sort(function(a,b){ return String(a.data).localeCompare(String(b.data)); });

      html += '<div class="atrasados"><div class="bloco-titulo">Ficou pra tras</div>';
      if(atrasados.length === 0){
        html += blocoVazio("Nada atrasado por aqui. Tudo em dia.");
      } else {
        atrasados.forEach(function(i){
          var d = diasEntre(hoje, i.data);
          html += '<div class="atraso-linha">' +
            '<span class="pilula p-status">' + esc(i.tipo) + '</span>' +
            '<strong style="font-weight:400">' + esc(i.titulo) + '</strong>' +
            (i.marca ? '<span style="color:var(--tinta-suave)">' + esc(i.marca) + '</span>' : "") +
            '<span class="atraso-dias">ha ' + d + ' dia' + (d === 1 ? "" : "s") + '</span>' +
            '<button class="btn btn-mini" data-feito="' + esc(i.id) + '" style="margin-left:auto">Marcar feito</button>' +
            '<button class="btn btn-mini" data-item="' + esc(i.id) + '">Abrir</button>' +
          '</div>';
        });
      }
      html += '</div>';

      painel.innerHTML = html;

      document.getElementById("mes-antes").addEventListener("click", function(){
        mesVisivel = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth() - 1, 1);
        desenhar();
      });
      document.getElementById("mes-depois").addEventListener("click", function(){
        mesVisivel = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth() + 1, 1);
        desenhar();
      });
      document.getElementById("mes-hoje").addEventListener("click", function(){
        var d = new Date();
        mesVisivel = new Date(d.getFullYear(), d.getMonth(), 1);
        desenhar();
      });
      document.getElementById("filtro-cal").addEventListener("change", function(e){
        filtroTipoCal = e.target.value;
        desenhar();
      });

      function novoNoDia(iso){
        abrirFormulario({
          titulo: "Novo item",
          tabela: "calendario",
          campos: CAMPOS_CAL,
          registro: { data: iso },
          antesDeSalvar: function(d){
            if(!d.titulo) return "Escreva o que e para fazer.";
            if(!d.data) return "Escolha a data.";
          },
          depois: telaCalendario
        });
      }

      document.getElementById("btn-novo-cal").addEventListener("click", function(){ novoNoDia(hojeISO()); });

      Array.prototype.forEach.call(painel.querySelectorAll("[data-add]"), function(b){
        b.addEventListener("click", function(e){
          e.stopPropagation();
          novoNoDia(b.getAttribute("data-add"));
        });
      });

  var FUNIL = ["Briefing","Roteiro","Aprovação Roteiro","Gravação","Edição","Aprovado","Entregue"];
  var CAMPOS_CAMP = [
    { nome: "campanha",  rotulo: "Campanha", tipo: "text" },
    { nome: "cliente",   rotulo: "Cliente",  tipo: "text" },
    { nome: "tipo",      rotulo: "Tipo",     tipo: "select", opcoes: ["Conteúdo","Publicidade"], padrao: "Conteúdo" },
    { nome: "status",    rotulo: "Status",   tipo: "select", opcoes: FUNIL, padrao: "Briefing" },
    { nome: "qtd",       rotulo: "Quantidade de videos", tipo: "number", padrao: 1 },
    { nome: "valor",     rotulo: "Valor total (R$)",     tipo: "number", passo: "0.01", padrao: 0 },
    { nome: "prazo",     rotulo: "Prazo",    tipo: "date" },
    { nome: "pagamento", rotulo: "Pagamento", tipo: "select", opcoes: [
        { valor: "pendente", texto: "Pendente" },
        { valor: "pago",     texto: "Pago" }
      ], padrao: "pendente" },
    { nome: "ativa",     rotulo: "Campanha ativa",   tipo: "checkbox", padrao: true },
    { nome: "favorita",  rotulo: "Destacar com estrela", tipo: "checkbox", padrao: false }
  ];

  var campFiltro = "todas", campBusca = "", campOrdem = { coluna: "prazo", crescente: true };

  async function telaCampanhas(){
    var r = await U.ler("campanhas", null);
    if(abaAtual!=="campanhas")return;
    var todas = r.dados;

    function filtrar(){
      var busca = campBusca.toLowerCase();
      return todas.filter(function(c){
        if(campFiltro === "ativas" && !c.ativa) return false;
        if(campFiltro === "finalizadas" && c.ativa) return false;
        if(!busca) return true;
        return (String(c.campanha || "") + " " + String(c.cliente || "")).toLowerCase().indexOf(busca) >= 0;
      });
    }

    function ordenar(lista){
      var col = campOrdem.coluna;
      var sinal = campOrdem.crescente ? 1 : -1;
      return lista.slice().sort(function(a, b){
        var va, vb;
        if(col === "status"){
          va = FUNIL.indexOf(a.status); vb = FUNIL.indexOf(b.status);
          if(va < 0) va = 99; if(vb < 0) vb = 99;
        } else if(col === "valor" || col === "qtd"){
          va = Number(a[col]) || 0; vb = Number(b[col]) || 0;
        } else if(col === "prazo"){
          va = a.prazo || "9999-12-31"; vb = b.prazo || "9999-12-31";
        } else if(col === "favorita"){
          va = a.favorita ? 0 : 1; vb = b.favorita ? 0 : 1;
        } else {
          va = String(a[col] || "").toLowerCase(); vb = String(b[col] || "").toLowerCase();
        }
        if(va < vb) return -1 * sinal;
        if(va > vb) return 1 * sinal;
        return 0;
      });
    }

    function avisoPrazo(c){
      if(!c.prazo) return "";
      if(c.status === "Entregue") return "";
      var d = diasEntre(c.prazo, hojeISO());
      if(d === null) return "";
      if(d < 0) return '<span class="pilula etiqueta-erro">atrasado ' + Math.abs(d) + ' dia' + (Math.abs(d) === 1 ? "" : "s") + '</span>';
      if(d <= 3) return '<span class="pilula etiqueta-alerta">vence em ' + d + ' dia' + (d === 1 ? "" : "s") + '</span>';
      return "";
    }

    function desenhar(){
      var lista = ordenar(filtrar());

      var reais=todas.filter(function(c){return !/^EXEMPLO/i.test(c.campanha||"");});
      var totalCampanhas = reais.length;
      var ativas = reais.filter(function(c){ return c.ativa; }).length;
      var valorTotal = todas.reduce(function(s, c){ return s + (Number(c.valor) || 0); }, 0);
      var totalVideos = todas.reduce(function(s, c){ return s + (Number(c.qtd) || 0); }, 0);
      var ticket = U.dividir(valorTotal, totalVideos);
      var aReceber = todas.filter(function(c){ return c.pagamento === "pendente"; })
                          .reduce(function(s, c){ return s + (Number(c.valor) || 0); }, 0);
      var recebido = todas.filter(function(c){ return c.pagamento === "pago"; })
                          .reduce(function(s, c){ return s + (Number(c.valor) || 0); }, 0);

      var html = "";
      html += blocoAviso(r.erro);

      html += '<div class="faixa-numeros">' +
        '<div class="num-item"><div class="num-valor">' + totalCampanhas + '</div><div class="num-rotulo">Campanhas</div></div>' +
        '<div class="num-item"><div class="num-valor">' + ativas + '</div><div class="num-rotulo">Ativas agora</div></div>' +
        '<div class="num-item"><div class="num-valor">' + U.emReais(valorTotal) + '</div><div class="num-rotulo">Valor total</div>' +
          '<div class="num-extra">' + (totalVideos > 0 ? U.emReais(ticket) + " por video" : "sem video cadastrado ainda") + '</div></div>' +
        '<div class="num-item"><div class="num-valor">' + U.emReais(aReceber) + '</div><div class="num-rotulo">A receber</div>' +
          '<div class="num-extra">' + U.emReais(recebido) + ' ja recebido</div></div>' +
      '</div>';

      html += '<div class="barra-acoes">' +
        '<button class="btn' + (campFiltro === "todas" ? " btn-cheio" : "") + '" data-filtro="todas">Todas</button>' +
        '<button class="btn' + (campFiltro === "ativas" ? " btn-cheio" : "") + '" data-filtro="ativas">Ativas</button>' +
        '<button class="btn' + (campFiltro === "finalizadas" ? " btn-cheio" : "") + '" data-filtro="finalizadas">Finalizadas</button>' +
        '<div class="cresce"><input type="search" id="busca-camp" placeholder="Buscar campanha ou cliente" value="' + esc(campBusca) + '"></div>' +
        '<button class="btn" id="btn-csv-camp">' + icone("baixar") + 'Baixar</button>' +
        '<button class="btn btn-cheio" id="btn-nova-camp">' + icone("mais") + 'Nova campanha</button>' +
      '</div>';

      if(todas.length === 0){
        html += blocoVazio("Voce ainda nao cadastrou campanhas. Clique em nova campanha para comecar.");
      } else if(lista.length === 0){
        html += blocoVazio("Nenhuma campanha com esse filtro.");
      } else {
        var colunas = [
          { id: "favorita", rotulo: "", largura: "32px" },
          { id: "campanha", rotulo: "Campanha" },
          { id: "cliente",  rotulo: "Cliente" },
          { id: "tipo",     rotulo: "Tipo" },
          { id: "status",   rotulo: "Status" },
          { id: "qtd",      rotulo: "Qtd" },
          { id: "valor",    rotulo: "Valor" },
          { id: "prazo",    rotulo: "Prazo" },
          { id: "pagamento",rotulo: "Pagamento" }
        ];

        html += '<div class="rolagem"><table><thead><tr>';
        colunas.forEach(function(col){
          var ordenando = campOrdem.coluna === col.id;
          var seta = ordenando ? (campOrdem.crescente ? "&#9650;" : "&#9660;") : "&#9671;";
          html += '<th class="ordenavel' + (ordenando ? " ordenando" : "") + '" data-col="' + col.id + '"' +
                  (col.largura ? ' style="width:' + col.largura + '"' : "") + '>' +
                  esc(col.rotulo) + '<span class="seta">' + seta + '</span></th>';
        });
        html += '</tr></thead><tbody>';

        lista.forEach(function(c){
          html += '<tr class="clicavel' + (c.favorita ? " favorita" : "") + '" data-id="' + esc(c.id) + '">' +
            '<td><button class="estrela' + (c.favorita ? " on" : "") + '" data-estrela="' + esc(c.id) + '" title="Destacar">&#9733;</button></td>' +
            '<td>' + esc(c.campanha || "sem nome") + '</td>' +
            '<td>' + esc(c.cliente || "") + '</td>' +
            '<td><span class="pilula ' + (c.tipo === "Publicidade" ? "p-publicidade" : "p-conteudo") + '">' + esc(c.tipo) + '</span></td>' +
            '<td><span class="pilula p-status">' + esc(c.status) + '</span></td>' +
            '<td>' + esc(c.qtd) + '</td>' +
            '<td>' + esc(U.emReais(c.valor)) + '</td>' +
            '<td>' + esc(U.paraBR(c.prazo)) + ' ' + avisoPrazo(c) + '</td>' +
            '<td><span class="pilula ' + (c.pagamento === "pago" ? "p-cliente" : "p-lead") + '">' + (c.pagamento === "pago" ? "Pago" : "Pendente") + '</span></td>' +
          '</tr>';
        });
        html += '</tbody></table></div>';
      }

      painel.innerHTML = html;

      Array.prototype.forEach.call(painel.querySelectorAll("[data-filtro]"), function(b){
        b.addEventListener("click", function(){ campFiltro = b.getAttribute("data-filtro"); desenhar(); });
      });

      var busca = document.getElementById("busca-camp");
      busca.addEventListener("input", function(){
        campBusca = busca.value;
        var p = busca.selectionStart;
        desenhar();
        var novo = document.getElementById("busca-camp");
        novo.focus();
        novo.setSelectionRange(p, p);
      });

      Array.prototype.forEach.call(painel.querySelectorAll("th[data-col]"), function(th){
        th.addEventListener("click", function(){
          var col = th.getAttribute("data-col");
          if(campOrdem.coluna === col) campOrdem.crescente = !campOrdem.crescente;
          else { campOrdem.coluna = col; campOrdem.crescente = true; }
          desenhar();
        });
      });

      Array.prototype.forEach.call(painel.querySelectorAll("[data-estrela]"), function(b){
        b.addEventListener("click", async function(e){
          e.stopPropagation();
          var id = b.getAttribute("data-estrela");
          var c = todas.filter(function(x){ return String(x.id) === id; })[0];
          var res = await U.gravar("campanhas", function(q){ return q.update({ favorita: !c.favorita }).eq("id", id); });
          if(!res.ok){ falar(res.erro, true); return; }
          telaCampanhas();
        });
      });

      Array.prototype.forEach.call(painel.querySelectorAll("tr[data-id]"), function(tr){
        tr.addEventListener("click", function(e){
          if(e.target.closest("[data-estrela]")) return;
          var c = todas.filter(function(x){ return String(x.id) === tr.getAttribute("data-id"); })[0];
          abrirFormulario({
            titulo: "Editar campanha",
            tabela: "campanhas",
            campos: CAMPOS_CAMP,
            registro: c,
            antesDeSalvar: function(d){ if(!d.campanha) return "Escreva o nome da campanha."; },
            depois: telaCampanhas
          });
        });
      });

      document.getElementById("btn-nova-camp").addEventListener("click", function(){
        abrirFormulario({
          titulo: "Nova campanha",
          tabela: "campanhas",
          campos: CAMPOS_CAMP,
          antesDeSalvar: function(d){ if(!d.campanha) return "Escreva o nome da campanha."; },
          depois: telaCampanhas
        });
      });

      document.getElementById("btn-csv-camp").addEventListener("click", function(){
        var lista2 = ordenar(filtrar());
        if(lista2.length === 0){ falar("Nao ha nada para baixar.", true); return; }
        baixarCSV("minhas-campanhas.csv",
          ["Campanha","Cliente","Tipo","Status","Qtd","Valor","Prazo","Pagamento","Ativa"],
          lista2.map(function(c){
            return [c.campanha, c.cliente, c.tipo, c.status, c.qtd,
                    String(Number(c.valor) || 0).replace(".", ","),
                    U.paraBR(c.prazo), c.pagamento, c.ativa ? "sim" : "nao"];
          })
        );
        falar("Arquivo baixado.");
      });
    }

    desenhar();
  }

  var subChecklist = "checklist";
  var marcadosMapa = {};
  var roteiroRascunho="";

  async function telaChecklist(){
    var B = window.Biblioteca;
    if(!B){
      painel.innerHTML = blocoAviso("Nao consegui carregar o arquivo js/biblioteca.js. Confira se ele esta na pasta js do projeto.");
      return;
    }

    var rm = await U.ler("marcados", null);
    if(abaAtual!=="checklist")return;
    marcadosMapa = {};
    rm.dados.forEach(function(m){ if(m.marcado) marcadosMapa[m.chave] = true; });

    function desenhar(){
      var abas = [
        { id: "checklist",   nome: "Checklist do portfolio" },
        { id: "referencias", nome: "Referencias de video" },
        { id: "roteiros",    nome: "Roteiros" },
        { id: "nichos",      nome: "Ideias por nicho" },
        { id: "revisao",     nome: "Revisar meu roteiro" }
      ];

      var html = blocoAviso(rm.erro);
      html += '<div class="sub-abas">';
      abas.forEach(function(a){
        html += '<button class="sub-aba' + (subChecklist === a.id ? " ativo" : "") + '" data-sub="' + a.id + '">' + esc(a.nome) + '</button>';
      });
      html += '</div><div id="sub-conteudo"></div>';

      painel.innerHTML = html;

      Array.prototype.forEach.call(painel.querySelectorAll("[data-sub]"), function(b){
        b.addEventListener("click", function(){ subChecklist = b.getAttribute("data-sub"); desenhar(); });
      });

      var alvo = document.getElementById("sub-conteudo");
      if(subChecklist === "checklist")   alvo.innerHTML = htmlChecklist(B);
      if(subChecklist === "referencias") alvo.innerHTML = htmlReferencias(B);
      if(subChecklist === "roteiros")    alvo.innerHTML = htmlRoteiros(B);
      if(subChecklist === "nichos")      alvo.innerHTML = htmlNichos(B);
      if(subChecklist === "revisao")     alvo.innerHTML = htmlRevisao(B);

      var campoRoteiro=document.getElementById("meu-roteiro");
      if(campoRoteiro){campoRoteiro.value=roteiroRascunho;campoRoteiro.addEventListener("input",function(){roteiroRascunho=this.value;});}
      ligarSecoes();
      if(subChecklist === "checklist")   ligarChecks();
      if(subChecklist === "revisao")     ligarChecks();
      if(subChecklist === "referencias") ligarReferencias(B);
    }

    function contarSecao(secao, indice){
      var feitos = 0;
      secao.itens.forEach(function(item, i){
        if(marcadosMapa["checklist:" + secao.id + ":" + i]) feitos++;
      });
      return feitos;
    }

    function htmlChecklist(B){
      var totalItens = 0, totalFeitos = 0;
      B.CHECKLIST.forEach(function(s){
        totalItens += s.itens.length;
        totalFeitos += contarSecao(s);
      });
      var pct = Math.round(U.dividir(totalFeitos, totalItens) * 100);

      var html = '<div class="progresso-geral"><span>' + totalFeitos + ' de ' + totalItens + ' prontos</span>' +
                 '<div class="barra-fundo"><div class="barra-cheia" style="width:' + pct + '%"></div></div>' +
                 '<span>' + pct + '%</span></div>';

      B.CHECKLIST.forEach(function(s){
        var feitos = contarSecao(s);
        var pctS = Math.round(U.dividir(feitos, s.itens.length) * 100);
        html += '<div class="secao">' +
          '<button class="secao-cabecalho" data-secao="1">' +
            '<span class="secao-emoji">' + s.emoji + '</span>' +
            '<span style="flex:1"><span class="secao-nome">' + esc(s.nome) + '</span><br>' +
            '<span class="secao-resumo">' + esc(s.resumo) + '</span></span>' +
            '<span class="secao-conta">' + feitos + '/' + s.itens.length + '</span>' +
          '</button>' +
          '<div class="secao-corpo">' +
            '<div class="barra-fundo" style="margin-bottom:0.8rem"><div class="barra-cheia" style="width:' + pctS + '%"></div></div>' +
            '<div class="secao-porque">' + esc(s.porque) + '</div>';
        s.itens.forEach(function(item, i){
          var chave = "checklist:" + s.id + ":" + i;
          var feito = !!marcadosMapa[chave];
          html += '<label class="item-check">' +
            '<input type="checkbox" data-chave="' + esc(chave) + '"' + (feito ? " checked" : "") + '>' +
            '<span><span class="item-t' + (feito ? " feito" : "") + '">' + esc(item.t) + '</span><br>' +
            '<span class="item-d">' + esc(item.d) + '</span></span></label>';
        });
        html += '</div></div>';
      });
      return html;
    }

    function htmlReferencias(B){
      var html = '<div class="grade-cartoes">';
      B.REFERENCIAS.forEach(function(r){
        html += '<button class="cartao-ref" data-ref="' + esc(r.id) + '">' +
          '<div class="ref-capa">' + r.emoji + '</div>' +
          '<div class="ref-corpo">' +
            '<div class="ref-titulo">' + esc(r.titulo) + '</div>' +
            '<div class="ref-meta">' + esc(r.estilo) + ' &middot; ' + esc(r.duracao) + '</div>' +
            '<div class="ref-meta">' + esc(r.marca) + '</div>' +
          '</div></button>';
      });
      html += '</div>';
      return html;
    }

    function ligarReferencias(B){
      Array.prototype.forEach.call(painel.querySelectorAll("[data-ref]"), function(b){
        b.addEventListener("click", function(){
          var r = B.REFERENCIAS.filter(function(x){ return x.id === b.getAttribute("data-ref"); })[0];
          if(!r) return;
          var h = '<div class="ref-meta" style="margin-bottom:0.8rem">' + esc(r.estilo) + ' &middot; ' + esc(r.duracao) + ' &middot; ' + esc(r.marca) + '</div>';
          h += '<div class="bloco-titulo">Gancho</div><p>' + esc(r.gancho) + '</p>';
          h += '<div class="bloco-titulo">Por que funciona</div><p>' + esc(r.porque) + '</p>';
          h += '<div class="bloco-titulo">O diferencial</div><p>' + esc(r.diferencial) + '</p>';
          h += '<div class="bloco-titulo">O erro comum</div><p>' + esc(r.erro) + '</p>';
          h += '<div class="bloco-titulo">O roteiro</div>';
          r.roteiro.forEach(function(b2){
            h += '<div class="bloco-tempo"><div class="bloco-t">' + esc(b2.t) + '</div><div class="bloco-o">' + b2.o + '</div></div>';
          });
          if(r.youtube){
            h += '<div class="modal-botoes"><a class="btn btn-cheio" href="' + esc(r.youtube) + '" target="_blank" rel="noopener">Assistir</a></div>';
          }
          abrirModal(r.titulo, h, true);
        });
      });
    }

    function htmlRoteiros(B){
      var html = "";
      B.TIPOS.forEach(function(t){
        html += '<div class="secao">' +
          '<button class="secao-cabecalho" data-secao="1">' +
            '<span class="secao-emoji">' + t.emoji + '</span>' +
            '<span style="flex:1"><span class="secao-nome">' + esc(t.nome) + '</span><br>' +
            '<span class="secao-resumo">' + esc(t.duracao) + '</span></span>' +
          '</button>' +
          '<div class="secao-corpo">' +
            '<div class="secao-porque">' + esc(t.porque) + '</div>';
        t.beats.forEach(function(b){
          html += '<div class="bloco-tempo"><div class="bloco-t">' + esc(b.t) + '</div><div class="bloco-o">' + b.o + '</div></div>';
        });
        if(t.erros && t.erros.length){
          html += '<div class="bloco-titulo" style="margin-top:0.9rem">Erros comuns</div>';
          t.erros.forEach(function(e){ html += '<div class="lista-ideia">' + esc(e) + '</div>'; });
        }
        html += '</div></div>';
      });
      return html;
    }

    function htmlNichos(B){
      var html = "";
      B.NICHOS.forEach(function(n){
        html += '<div class="secao">' +
          '<button class="secao-cabecalho" data-secao="1">' +
            '<span class="secao-emoji">' + n.emoji + '</span>' +
            '<span style="flex:1"><span class="secao-nome">' + esc(n.nome) + '</span><br>' +
            '<span class="secao-resumo">' + n.ideias.length + ' ideias</span></span>' +
          '</button><div class="secao-corpo">';
        n.ideias.forEach(function(i){
          html += '<div class="lista-ideia">' + esc(i.t) +
                  '<div class="lista-gancho">' + esc(i.gancho) + '</div></div>';
        });
        html += '</div></div>';
      });
      return html;
    }

    function htmlRevisao(B){
      var html = '<div class="modal-campo"><label for="meu-roteiro">Cole o seu roteiro aqui</label>' +
                 '<textarea id="meu-roteiro" style="min-height:150px" placeholder="Cole o texto do seu roteiro para conferir item por item"></textarea></div>';
      B.REVISAO.forEach(function(bloco, bi){
        html += '<div class="secao aberta">' +
          '<button class="secao-cabecalho" data-secao="1">' +
            '<span class="secao-emoji">' + bloco.emoji + '</span>' +
            '<span style="flex:1"><span class="secao-nome">' + esc(bloco.bloco) + '</span></span>' +
          '</button><div class="secao-corpo">';
        bloco.itens.forEach(function(item, i){
          var chave = "revisao:" + bi + ":" + i;
          var feito = !!marcadosMapa[chave];
          html += '<label class="item-check">' +
            '<input type="checkbox" data-chave="' + esc(chave) + '"' + (feito ? " checked" : "") + '>' +
            '<span><span class="item-t' + (feito ? " feito" : "") + '">' + esc(item.t) + '</span><br>' +
            '<span class="item-d">' + esc(item.d) + '</span></span></label>';
        });
        html += '</div></div>';
      });
      return html;
    }

    function ligarSecoes(){
      Array.prototype.forEach.call(painel.querySelectorAll("[data-secao]"), function(b){
        b.addEventListener("click", function(){
          b.parentElement.classList.toggle("aberta");
        });
      });
    }

    function ligarChecks(){
      Array.prototype.forEach.call(painel.querySelectorAll("input[data-chave]"), function(inp){
        inp.addEventListener("change", async function(){
          var chave = inp.getAttribute("data-chave");
          var anterior=!!marcadosMapa[chave];
          inp.disabled=true;
          marcadosMapa[chave] = inp.checked;
          var r = await U.gravar("marcados", function(q){
            return q.upsert({ chave: chave, marcado: inp.checked, atualizado_em: new Date().toISOString() },
                            { onConflict: "chave" });
          });
          inp.disabled=false;
          if(!r.ok){marcadosMapa[chave]=anterior;inp.checked=anterior;falar(r.erro,true);return;}
          if(subChecklist === "checklist") desenhar();
          else {
            var texto = inp.parentElement.querySelector(".item-t");
            if(texto) texto.classList.toggle("feito", inp.checked);
          }
        });
      });
    }

    desenhar();
  }

  /* ============================================================
     PARTE 9: ABA IDEIAS
     ============================================================ */
  var CAMPOS_IDEIA = [
    { nome: "titulo",    rotulo: "Ideia",      tipo: "text" },
    { nome: "descricao", rotulo: "Detalhes",   tipo: "textarea" },
    { nome: "nicho",     rotulo: "Nicho",      tipo: "select", opcoes: [
        { valor: "casa", texto: "Casa e decoracao" },
        { valor: "pet",  texto: "Pet" },
        { valor: "tech", texto: "Tech" },
        { valor: "",     texto: "Sem nicho" }
      ], padrao: "casa" },
    { nome: "status",    rotulo: "Situacao",   tipo: "select", opcoes: [
        { valor: "nova",      texto: "Nova" },
        { valor: "gravando",  texto: "Gravando" },
        { valor: "publicada", texto: "Publicada" },
        { valor: "descartada",texto: "Descartada" }
      ], padrao: "nova" }
  ];

  async function telaIdeias(){
    var r = await U.ler("ideias", function(q){ return q.order("criado_em", { ascending: false }); });
    if(abaAtual!=="ideias")return;
    var lista = r.dados;

    var html = blocoAviso(r.erro);

    html += '<div class="barra-acoes"><div class="cresce">' +
      '<div class="topo-sub">Guarde aqui as ideias que aparecem no meio do dia. Importe o arquivo do Trello para trazer títulos e descrições sem duplicar ideias. A atualização é feita quando você importa um novo arquivo.</div>' +
      '</div><button class="btn btn-cheio" id="btn-nova-ideia">' + icone("mais") + 'Nova ideia</button></div>';

    html += '<div class="barra-acoes"><label class="btn" for="trello-arquivo">Importar ideias do Trello</label><input id="trello-arquivo" type="file" accept=".json,application/json" hidden><a class="btn" href="https://trello.com/b/1J5KLxi2/bypriscila-producao-de-conteudo" target="_blank" rel="noopener">Abrir meu Trello</a></div><p class="topo-sub">Escolha ideias-trello.json ou uma exportação JSON do seu quadro. Você escolhe quais listas importar. Os dados ficam na sua área privada.</p>';
    if(lista.length === 0){
      html += blocoVazio("Nenhuma ideia guardada ainda. Clique em nova ideia para escrever a primeira.");
    } else {
      html += '<div class="rolagem"><table><thead><tr>' +
        '<th>Ideia</th><th>Nicho</th><th>Situacao</th><th>Origem</th><th>Guardada em</th>' +
        '</tr></thead><tbody>';
      var nomeNicho = { casa: "Casa e decoracao", pet: "Pet", tech: "Tech" };
      lista.forEach(function(i){
        html += '<tr class="clicavel" data-id="' + esc(i.id) + '">' +
          '<td>' + esc(i.titulo || "sem titulo") +
            (i.descricao ? '<div class="lista-gancho">' + esc(String(i.descricao).slice(0, 70)) + (String(i.descricao).length > 70 ? "..." : "") + '</div>' : "") + '</td>' +
          '<td>' + esc(nomeNicho[i.nicho] || i.nicho || "") + '</td>' +
          '<td><span class="pilula p-status">' + esc(i.status) + '</span></td>' +
          '<td>' + esc(i.origem) + (i.trello_lista ? '<div class="lista-gancho">'+esc(i.trello_lista)+'</div>':'') + (U.urlSegura(i.trello_url)?'<a href="'+esc(U.urlSegura(i.trello_url))+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Ver cartão</a>':'') + '</td>' +
          '<td>' + esc(U.paraBR(i.criado_em)) + '</td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
    }

    painel.innerHTML = html;

    document.getElementById('trello-arquivo').addEventListener('change',async function(){
      const arquivo=this.files[0];if(!arquivo)return;
      try{
        if(arquivo.size>20*1024*1024)throw Error();
        const dados=JSON.parse(await arquivo.text());
        if(!Array.isArray(dados.cards)||!Array.isArray(dados.lists))throw Error();
        const listas=dados.lists.filter(l=>!l.closed);
        abrirModal('Importar do Trello','<p>Escolha as listas. Importar novamente atualiza as ideias vindas do Trello, sem duplicar. As ideias criadas aqui continuam guardadas.</p>'+listas.map((l,i)=>'<label class="item-check"><input type="checkbox" data-lista="'+i+'" '+(/IDEIAS/i.test(l.name)?'checked':'')+'><span>'+esc(l.name)+'</span></label>').join('')+'<button class="btn btn-cheio" id="confirmar-trello">Importar listas selecionadas</button>');
        document.getElementById('confirmar-trello').addEventListener('click',async function(){
          this.disabled=true;
          const selecionadas=Array.from(modalCorpo.querySelectorAll('[data-lista]:checked')).map(el=>listas[Number(el.dataset.lista)]);
          if(!selecionadas.length){falar('Escolha pelo menos uma lista.',true);this.disabled=false;return;}
          const registros=dados.cards.filter(c=>!c.closed&&selecionadas.some(l=>l.id===c.idList)).map(c=>({
            titulo:String(c.name||'Sem título'),descricao:String(c.desc||''),nicho:'',status:'nova',origem:'trello',trello_id:String(c.id),trello_url:U.urlSegura(c.url||c.shortUrl),trello_lista:String((listas.find(l=>l.id===c.idList)||{}).name||'')
          }));
          let feitos=0;
          for(let i=0;i<registros.length;i+=100){const resultado=await U.gravar('ideias',q=>q.upsert(registros.slice(i,i+100),{onConflict:'trello_id'}));if(!resultado.ok){falar(resultado.erro,true);this.disabled=false;return;}feitos+=Math.min(100,registros.length-i);}
          fecharModal();falar(feitos+' ideias importadas.');telaIdeias();
        });
      }catch(e){falar('Não consegui ler esse arquivo. Escolha a exportação JSON do Trello.',true);}
    });

    document.getElementById("btn-nova-ideia").addEventListener("click", function(){
      abrirFormulario({
        titulo: "Nova ideia",
        tabela: "ideias",
        campos: CAMPOS_IDEIA,
        antesDeSalvar: function(d){ if(!d.titulo) return "Escreva a ideia."; },
        depois: telaIdeias
      });
    });

    Array.prototype.forEach.call(painel.querySelectorAll("tr[data-id]"), function(tr){
      tr.addEventListener("click", function(){
        var i = lista.filter(function(x){ return String(x.id) === tr.getAttribute("data-id"); })[0];
        abrirFormulario({
          titulo: "Editar ideia",
          tabela: "ideias",
          campos: CAMPOS_IDEIA,
          registro: i,
          antesDeSalvar: function(d){ if(!d.titulo) return "Escreva a ideia."; },
          depois: telaIdeias
        });
      });
    });
  }

  /* ============================================================
     PARTE 10: LIGAR TUDO
     ============================================================ */
  function iniciar(){
    document.getElementById("menu-email").textContent =
      (sessaoAtual && sessaoAtual.user && sessaoAtual.user.email) || "";

    document.getElementById("btn-sair").addEventListener("click", async function(){
      try { await U.sair(); } catch(err){ /* mesmo se falhar, sai da tela */ }
      window.location.replace("../login/");
    });

    montarMenu();
    irPara("portfolio");
  }

})();
</script>
</body>
